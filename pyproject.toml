[project]
name = "fittrack-bot"
version = "0.1.0"
description = "FitTrack — mahalliy (O'zbek) taomlarni biladigan makros-tracker Telegram bot"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "FitTrack Team" }]

# Asosiy (core) bog'liqliklar — bot ishlashi uchun minimal to'plam.
dependencies = [
    "aiogram>=3.13,<4.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3.0",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "apscheduler>=3.10",
    "matplotlib>=3.9",
    "structlog>=24.4",
]

[project.optional-dependencies]
# Embedding (fuzzy taom moslash) — og'ir, Bosqich 1 da kerak bo'ladi.
# Python 3.11/3.12 da o'rnatiladi; torch talab qiladi.
embeddings = [
    "sentence-transformers>=3.0",
    "numpy>=1.26",
]
# Ishlab chiqish (development) vositalari.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Vositalar sozlamalari
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "B008",  # FastAPI Depends() default argument pattern
    # Atayin ishlatilgan Unicode: matematik belgilar (−, ·) va o'zbekcha matn.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "migrations/*"]
