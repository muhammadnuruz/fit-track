<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitTrack</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #111111);
    --hint: var(--tg-theme-hint-color, #8a8a8a);
    --card: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --accent: var(--tg-theme-button-color, #2ea6ff);
    --accent-text: var(--tg-theme-button-text-color, #ffffff);
    --border: rgba(128, 128, 128, 0.25);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
    -webkit-tap-highlight-color: transparent;
  }
  .progress { height: 4px; background: var(--border); border-radius: 4px; margin-bottom: 20px; overflow: hidden; }
  .progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s; }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p.hint { color: var(--hint); font-size: 14px; margin: 0 0 18px; }
  label { display: block; font-size: 14px; color: var(--hint); margin-bottom: 6px; }
  input[type=text], input[type=number] {
    width: 100%; padding: 14px; font-size: 17px; border-radius: 12px;
    border: 1px solid var(--border); background: var(--card); color: var(--text); outline: none;
  }
  input:focus { border-color: var(--accent); }
  .options { display: grid; gap: 10px; }
  .opt {
    padding: 16px; border-radius: 12px; border: 2px solid var(--border);
    background: var(--card); font-size: 16px; cursor: pointer; transition: border-color .15s;
  }
  .opt small { display: block; color: var(--hint); font-size: 13px; margin-top: 3px; }
  .opt.sel { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .nav { display: flex; gap: 10px; margin-top: 24px; }
  button.btn {
    flex: 1; padding: 15px; font-size: 16px; font-weight: 600; border: none; border-radius: 12px;
    background: var(--accent); color: var(--accent-text); cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--border); }
  button.btn:disabled { opacity: .5; }
  .err { color: #e5484d; font-size: 13px; margin-top: 8px; min-height: 16px; }
  .plan { text-align: center; padding-top: 20px; }
  .plan .big { font-size: 34px; font-weight: 700; margin: 8px 0; }
  .macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
  .macros div { background: var(--card); border-radius: 12px; padding: 14px 6px; }
  .macros b { display: block; font-size: 18px; }
  .macros span { color: var(--hint); font-size: 12px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="progress"><i id="bar"></i></div>
<div id="root"></div>
<div class="err" id="err"></div>
<div class="nav" id="nav"></div>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

const params = new URLSearchParams(location.search);
const LANG = (["uz","ru","en"].includes(params.get("lang"))) ? params.get("lang")
  : ((tg && tg.initDataUnsafe && tg.initDataUnsafe.user && ["uz","ru","en"].includes(tg.initDataUnsafe.user.language_code)) ? tg.initDataUnsafe.user.language_code : "uz");

const T = {
  uz: {
    title: "Profil", hintName: "Sizni qanday chaqiraylik?",
    name: "Ismingiz", gender: "Jinsingiz", male: "Erkak", female: "Ayol",
    age: "Yoshingiz", height: "Bo'yingiz (sm)", weight: "Vazningiz (kg)",
    activity: "Kunlik faollik", goal: "Maqsadingiz",
    a_sedentary: "Kam harakat", a_sedentary_d: "Ofis ishi, sport yo'q",
    a_light: "Yengil", a_light_d: "Haftada 1-3 kun sport",
    a_moderate: "O'rtacha", a_moderate_d: "Haftada 3-5 kun sport",
    a_active: "Faol", a_active_d: "Haftada 6-7 kun sport",
    a_very_active: "Juda faol", a_very_active_d: "Og'ir jismoniy ish / kuniga 2 marta",
    g_cut: "Vazn kamaytirish", g_maintain: "Saqlab qolish", g_bulk: "Massa yig'ish",
    measures: "Qo'shimcha o'lchovlar", measures_hint: "Tana yog'ini hisoblash uchun (ixtiyoriy)",
    waist: "Bel (sm)", neck: "Bo'yin (sm)", hip: "Son (sm)",
    hipNote: "Ayollar uchun son o'lchovi tana yog'ini hisoblashga kerak.",
    back: "Orqaga", next: "Keyingi", skip: "O'tkazib yuborish", finish: "Yakunlash",
    planTitle: "Rejangiz tayyor!", kcalLabel: "kunlik kaloriya",
    protein: "Protein", carb: "Uglevod", fat: "Yog'", close: "Yopish",
    already: "Siz allaqachon ro'yxatdan o'tgansiz.",
    errRequired: "Bu maydonni to'ldiring", errRange: "Qiymat oralig'i noto'g'ri",
    errSend: "Xatolik yuz berdi, qayta urinib ko'ring", sending: "Yuborilmoqda...",
  },
  ru: {
    title: "Профиль", hintName: "Как к вам обращаться?",
    name: "Ваше имя", gender: "Пол", male: "Мужской", female: "Женский",
    age: "Возраст", height: "Рост (см)", weight: "Вес (кг)",
    activity: "Активность", goal: "Ваша цель",
    a_sedentary: "Малоподвижный", a_sedentary_d: "Офис, без спорта",
    a_light: "Лёгкая", a_light_d: "1-3 тренировки в неделю",
    a_moderate: "Средняя", a_moderate_d: "3-5 тренировок в неделю",
    a_active: "Высокая", a_active_d: "6-7 тренировок в неделю",
    a_very_active: "Очень высокая", a_very_active_d: "Тяжёлый труд / 2 раза в день",
    g_cut: "Снижение веса", g_maintain: "Поддержание", g_bulk: "Набор массы",
    measures: "Доп. замеры", measures_hint: "Для расчёта жира (необязательно)",
    waist: "Талия (см)", neck: "Шея (см)", hip: "Бёдра (см)",
    hipNote: "Для женщин замер бёдер нужен для расчёта жира.",
    back: "Назад", next: "Далее", skip: "Пропустить", finish: "Завершить",
    planTitle: "Ваш план готов!", kcalLabel: "калорий в день",
    protein: "Белки", carb: "Углеводы", fat: "Жиры", close: "Закрыть",
    already: "Вы уже зарегистрированы.",
    errRequired: "Заполните это поле", errRange: "Значение вне диапазона",
    errSend: "Произошла ошибка, попробуйте снова", sending: "Отправка...",
  },
  en: {
    title: "Profile", hintName: "What should we call you?",
    name: "Your name", gender: "Gender", male: "Male", female: "Female",
    age: "Age", height: "Height (cm)", weight: "Weight (kg)",
    activity: "Activity level", goal: "Your goal",
    a_sedentary: "Sedentary", a_sedentary_d: "Office job, no sport",
    a_light: "Light", a_light_d: "1-3 workouts per week",
    a_moderate: "Moderate", a_moderate_d: "3-5 workouts per week",
    a_active: "Active", a_active_d: "6-7 workouts per week",
    a_very_active: "Very active", a_very_active_d: "Hard labor / twice a day",
    g_cut: "Lose weight", g_maintain: "Maintain", g_bulk: "Gain muscle",
    measures: "Extra measurements", measures_hint: "For body fat estimate (optional)",
    waist: "Waist (cm)", neck: "Neck (cm)", hip: "Hip (cm)",
    hipNote: "For women, hip measurement is needed for body fat.",
    back: "Back", next: "Next", skip: "Skip", finish: "Finish",
    planTitle: "Your plan is ready!", kcalLabel: "daily calories",
    protein: "Protein", carb: "Carbs", fat: "Fat", close: "Close",
    already: "You are already registered.",
    errRequired: "Please fill this field", errRange: "Value is out of range",
    errSend: "Something went wrong, try again", sending: "Sending...",
  },
};
const L = T[LANG];

const data = {
  name: "", gender: null, age: null, height_cm: null,
  weight_kg: null, activity: null, goal: null, waist_cm: null, neck_cm: null, hip_cm: null,
};

const numSteps = [
  { key: "age", label: L.age, min: 10, max: 100 },
  { key: "height_cm", label: L.height, min: 100, max: 250 },
  { key: "weight_kg", label: L.weight, min: 30, max: 350 },
];

let step = 0;
const TOTAL = 8;
const root = document.getElementById("root");
const nav = document.getElementById("nav");
const errBox = document.getElementById("err");
const bar = document.getElementById("bar");

function setErr(msg) { errBox.textContent = msg || ""; }
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function render() {
  setErr("");
  bar.style.width = Math.round((step / TOTAL) * 100) + "%";
  if (step === 0) return renderName();
  if (step === 1) return renderGender();
  if (step >= 2 && step <= 4) return renderNumber(numSteps[step - 2]);
  if (step === 5) return renderActivity();
  if (step === 6) return renderGoal();
  if (step === 7) return renderMeasures();
}

function navButtons(nextLabel, onNext, opts) {
  opts = opts || {};
  nav.innerHTML = "";
  if (step > 0) {
    const b = document.createElement("button");
    b.className = "btn ghost"; b.textContent = L.back;
    b.onclick = () => { step--; render(); };
    nav.appendChild(b);
  }
  const n = document.createElement("button");
  n.className = "btn"; n.textContent = nextLabel; n.onclick = onNext;
  nav.appendChild(n);
  if (opts.skip) {
    const s = document.createElement("button");
    s.className = "btn ghost"; s.textContent = L.skip; s.onclick = opts.skip;
    nav.appendChild(s);
  }
}

function renderName() {
  root.innerHTML = `<h1>${esc(L.name)}</h1><p class="hint">${esc(L.hintName)}</p>
    <input id="f" type="text" maxlength="128" value="${esc(data.name)}" />`;
  const f = document.getElementById("f");
  f.focus();
  navButtons(L.next, () => {
    const v = f.value.trim();
    if (!v) return setErr(L.errRequired);
    data.name = v; step++; render();
  });
}

function renderGender() {
  root.innerHTML = `<h1>${esc(L.gender)}</h1>
    <div class="options">
      <div class="opt ${data.gender==='male'?'sel':''}" data-v="male">${esc(L.male)}</div>
      <div class="opt ${data.gender==='female'?'sel':''}" data-v="female">${esc(L.female)}</div>
    </div>`;
  root.querySelectorAll(".opt").forEach(el => el.onclick = () => {
    data.gender = el.dataset.v; step++; render();
  });
  navButtons(L.next, () => { if (!data.gender) return setErr(L.errRequired); step++; render(); });
}

function renderNumber(cfg) {
  root.innerHTML = `<h1>${esc(cfg.label)}</h1>
    <input id="f" type="number" inputmode="decimal" value="${data[cfg.key] ?? ""}" />`;
  const f = document.getElementById("f");
  f.focus();
  navButtons(L.next, () => {
    const v = parseFloat(f.value);
    if (isNaN(v)) return setErr(L.errRequired);
    if (v < cfg.min || v > cfg.max) return setErr(L.errRange + ` (${cfg.min}–${cfg.max})`);
    data[cfg.key] = v; step++; render();
  });
}

function activityOpts() {
  return ["sedentary","light","moderate","active","very_active"].map(v =>
    `<div class="opt ${data.activity===v?'sel':''}" data-v="${v}">${esc(L["a_"+v])}<small>${esc(L["a_"+v+"_d"])}</small></div>`
  ).join("");
}

function renderActivity() {
  root.innerHTML = `<h1>${esc(L.activity)}</h1><div class="options">${activityOpts()}</div>`;
  root.querySelectorAll(".opt").forEach(el => el.onclick = () => { data.activity = el.dataset.v; step++; render(); });
  navButtons(L.next, () => { if (!data.activity) return setErr(L.errRequired); step++; render(); });
}

function renderGoal() {
  const opts = ["cut","maintain","bulk"].map(v =>
    `<div class="opt ${data.goal===v?'sel':''}" data-v="${v}">${esc(L["g_"+v])}</div>`).join("");
  root.innerHTML = `<h1>${esc(L.goal)}</h1><div class="options">${opts}</div>`;
  root.querySelectorAll(".opt").forEach(el => el.onclick = () => { data.goal = el.dataset.v; step++; render(); });
  navButtons(L.next, () => { if (!data.goal) return setErr(L.errRequired); step++; render(); });
}

function renderMeasures() {
  const hipNote = data.gender === "female" ? `<p class="hint">${esc(L.hipNote)}</p>` : "";
  root.innerHTML = `<h1>${esc(L.measures)}</h1><p class="hint">${esc(L.measures_hint)}</p>
    <div class="row">
      <div><label>${esc(L.waist)}</label><input id="waist" type="number" inputmode="decimal" value="${data.waist_cm ?? ""}" /></div>
      <div><label>${esc(L.neck)}</label><input id="neck" type="number" inputmode="decimal" value="${data.neck_cm ?? ""}" /></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div><label>${esc(L.hip)}</label><input id="hip" type="number" inputmode="decimal" value="${data.hip_cm ?? ""}" /></div>
    </div>${hipNote}`;
  const grab = () => {
    data.waist_cm = parseNum("waist", 30, 250);
    data.neck_cm = parseNum("neck", 15, 100);
    data.hip_cm = parseNum("hip", 40, 250);
  };
  navButtons(L.finish, () => { grab(); submit(); }, { skip: () => {
    data.waist_cm = data.neck_cm = data.hip_cm = null; submit();
  }});
}

function parseNum(id, min, max) {
  const el = document.getElementById(id);
  if (!el || el.value.trim() === "") return null;
  const v = parseFloat(el.value);
  if (isNaN(v) || v < min || v > max) return null;
  return v;
}

async function submit() {
  setErr(L.sending);
  nav.querySelectorAll("button").forEach(b => b.disabled = true);
  const body = {
    init_data: tg ? tg.initData : "",
    name: data.name, gender: data.gender, age: Math.round(data.age),
    height_cm: data.height_cm, weight_kg: data.weight_kg,
    activity: data.activity, goal: data.goal,
    waist_cm: data.waist_cm, neck_cm: data.neck_cm, hip_cm: data.hip_cm,
  };
  try {
    const res = await fetch("/api/onboarding", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("http " + res.status);
    const json = await res.json();
    if (json.already) return showAlready();
    showPlan(json.plan);
  } catch (e) {
    setErr(L.errSend);
    nav.querySelectorAll("button").forEach(b => b.disabled = false);
  }
}

function showAlready() {
  bar.style.width = "100%";
  root.innerHTML = `<div class="plan"><h1>✅</h1><p class="hint">${esc(L.already)}</p></div>`;
  nav.innerHTML = "";
  closeButton();
  setErr("");
}

function showPlan(plan) {
  bar.style.width = "100%";
  const bf = plan.body_fat_pct != null ? `<span>🧬 ${plan.body_fat_pct}%</span>` : "";
  root.innerHTML = `<div class="plan">
    <h1>${esc(L.planTitle)}</h1>
    <div class="big">${plan.target_kcal}</div>
    <p class="hint">${esc(L.kcalLabel)} · BMI ${plan.bmi} ${bf}</p>
    <div class="macros">
      <div><b>${plan.macros.protein_g}g</b><span>${esc(L.protein)}</span></div>
      <div><b>${plan.macros.carb_g}g</b><span>${esc(L.carb)}</span></div>
      <div><b>${plan.macros.fat_g}g</b><span>${esc(L.fat)}</span></div>
    </div>
  </div>`;
  nav.innerHTML = "";
  closeButton();
  setErr("");
  if (tg) setTimeout(() => tg.close(), 3500);
}

function closeButton() {
  const b = document.createElement("button");
  b.className = "btn"; b.textContent = L.close;
  b.onclick = () => { if (tg) tg.close(); };
  nav.appendChild(b);
}

render();
</script>
</body>
</html>
