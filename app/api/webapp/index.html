<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --paper: #f6f1ea;
    --paper-strong: #efe7db;
    --card: #ffffff;
    --card-2: #ffffff;
    --ink: #1a1917;
    --ink-soft: #5d574f;
    --line: rgba(26,25,23,0.10);
    --green: #1f9d55;
    --green-deep: #17864a;
    --navy: #1e4c9a;
    --coral: #ff705d;
    --amber: #f5b301;
    --sky: #2ba0ff;
    --bad: #e0533f;
    --shadow: 0 12px 28px rgba(26,25,23,0.04);
    --radius-xl: 30px;
    --radius-lg: 20px;
    --radius-md: 15px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    padding:
      calc(12px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(14px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
  }

  .app {
    width: 100%;
    max-width: 440px;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .head {
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 2px 0 12px;
  }

  .brand-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0;
    border-radius: 999px;
    background: transparent;
    border: none;
  }

  .logo {
    width: 116px;
    height: auto;
    display: block;
    flex: none;
    background: transparent;
    mix-blend-mode: multiply;
  }

  .brand {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.06em;
    color: var(--ink);
  }

  .brand .g {
    color: var(--green);
  }

  .tag {
    margin-top: 6px;
    color: var(--ink-soft);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    font-weight: 600;
  }

  .pwrap {
    flex: none;
    margin: 0 0 12px;
  }

  .ptop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .ptop b {
    color: var(--green);
    font-weight: 700;
  }

  .bar {
    height: 10px;
    background: rgba(44,46,42,0.08);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }

  .bar > i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--green) 0%, var(--navy) 100%);
    transition: width 0.35s ease;
  }

  .card {
    flex: 0 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    margin: auto 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 20px 16px 18px;
    box-shadow: none;
    animation: rise 0.35s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 4.6vw, 30px);
    line-height: 1.08;
    letter-spacing: -0.06em;
    font-weight: 700;
  }

  p.sub {
    margin: 0 0 14px;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.45;
  }

  .field {
    position: relative;
    margin-bottom: 14px;
  }

  .dob-grid {
    display: grid;
    grid-template-columns: 0.8fr 1.55fr 1.05fr;
    gap: 8px;
    margin-top: 6px;
  }

  .dob-box {
    position: relative;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 10px 6px 8px;
    min-height: 62px;
  }

  .dob-box::after {
    content: "";
    position: absolute;
    right: 7px;
    bottom: 15px;
    width: 6px;
    height: 6px;
    border-right: 2px solid var(--ink-soft);
    border-bottom: 2px solid var(--ink-soft);
    transform: rotate(45deg);
    opacity: 0.45;
    pointer-events: none;
  }

  .dob-box label {
    display: block;
    margin-bottom: 6px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .dob-box input,
  .dob-box select {
    width: 100%;
    border: none;
    background: transparent;
    padding: 0;
    font-size: 16px;
    color: var(--ink);
    text-align: center;
    outline: none;
  }

  .dob-box select {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    text-align-last: center;
    padding: 0 14px 0 2px;
    cursor: pointer;
    text-overflow: ellipsis;
  }

  .dob-box input::placeholder {
    color: rgba(44,46,42,0.35);
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }

  input {
    width: 100%;
    padding: 16px 48px 16px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.8);
    color: var(--ink);
    font-size: 17px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }

  input:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(30,76,154,0.12);
  }

  input.good {
    border-color: var(--green);
    box-shadow: 0 0 0 4px rgba(31,157,85,0.12);
  }

  input.bad {
    border-color: var(--bad);
    box-shadow: 0 0 0 4px rgba(224,83,63,0.10);
  }

  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .tick {
    position: absolute;
    right: 13px;
    top: 40px;
    width: 22px;
    height: 22px;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .tick.show {
    opacity: 1;
    transform: scale(1);
  }

  .micro, .ferr {
    margin: 4px 2px 0;
    font-size: 12px;
    line-height: 1.4;
  }

  .micro {
    color: var(--ink-soft);
  }

  .ferr {
    color: #c14c3d;
    min-height: 18px;
  }

  .options {
    display: grid;
    gap: 10px;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 54px;
    padding: 10px 14px;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  .opt .ic {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: rgba(31,157,85,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .opt .ic svg {
    width: 26px;
    height: 26px;
    display: block;
  }

  .opt:hover { transform: translateY(-1px); }

  .opt .txt {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .opt small {
    display: block;
    margin-top: 3px;
    color: var(--ink-soft);
    font-weight: 500;
    font-size: 12px;
    line-height: 1.4;
  }

  .opt .rad {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(27, 26, 24, 0.28);
    position: relative;
    flex: none;
  }

  .opt.sel {
    border-color: var(--green);
    background: rgba(31,157,85,0.06);
  }

  .opt.sel .rad {
    border-color: var(--green);
  }

  .opt.sel .rad::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--green);
  }

  .nav {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 12px;
  }

  button.btn {
    appearance: none;
    border: 0;
    font: inherit;
    cursor: pointer;
    border-radius: 999px;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn.ghost {
    flex: 0 0 auto;
    padding: 14px 18px;
    background: rgba(255,255,255,0.42);
    border: 1px solid rgba(44,46,42,0.08);
    color: var(--ink);
    font-weight: 600;
  }

  .btn:not(.ghost) {
    flex: 1;
    padding: 15px 18px;
    background: linear-gradient(135deg, var(--green) 0%, var(--navy) 100%);
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.02em;
    box-shadow: none;
    text-transform: none;
  }

  .btn.cta {
    background: linear-gradient(135deg, var(--green) 0%, var(--navy) 100%);
    box-shadow: none;
  }

  .toast {
    position: fixed;
    left: 50%;
    top: calc(16px + env(safe-area-inset-top));
    transform: translate(-50%, -80px);
    background: rgba(44,46,42,0.94);
    color: #fff;
    padding: 12px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    box-shadow: var(--shadow);
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
    z-index: 9;
  }

  .toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
  }

  .plan {
    text-align: center;
  }

  .plan .ok {
    width: 48px;
    height: 48px;
    margin: 0 auto 6px;
    animation: pop 0.42s ease both;
  }

  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .plan h1 {
    font-size: clamp(23px, 5.6vw, 32px);
    margin-top: 4px;
  }

  .plan .big {
    margin-top: 6px;
    font-size: clamp(36px, 9.5vw, 52px);
    line-height: 0.9;
    font-weight: 800;
    letter-spacing: -0.08em;
    color: var(--ink);
  }

  .plan .kc {
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .macros {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .macros div {
    background: var(--card-2);
    border: 1px solid rgba(44,46,42,0.08);
    border-radius: 18px;
    padding: 10px 6px 9px;
  }

  .macros b {
    display: block;
    font-size: 21px;
    letter-spacing: -0.06em;
    color: var(--green);
  }

  .macros .mi {
    display: flex;
    justify-content: center;
    margin-bottom: 4px;
  }

  .macros .mi svg {
    width: 22px;
    height: 22px;
  }

  .macros span {
    display: block;
    margin-top: 2px;
    color: var(--ink-soft);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .calc {
    text-align: center;
    padding: 8px 0 6px;
  }

  .calc .ring {
    width: 78px;
    height: 78px;
    margin: 6px auto 18px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--green), var(--navy), var(--sky), var(--green));
    -webkit-mask: radial-gradient(farthest-side, #0000 calc(100% - 8px), #000 calc(100% - 8px));
    mask: radial-gradient(farthest-side, #0000 calc(100% - 8px), #000 calc(100% - 8px));
    animation: spin 0.85s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .calc h1 {
    font-size: clamp(21px, 4.6vw, 27px);
    margin-bottom: 10px;
  }

  .calc .cstep {
    color: var(--ink-soft);
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 18px;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .calc .cbar {
    height: 8px;
    width: 80%;
    max-width: 240px;
    margin: 0 auto;
    background: rgba(44,46,42,0.08);
    border-radius: 999px;
    overflow: hidden;
  }

  .calc .cbar > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--green), var(--navy));
    transition: width 2.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .chips {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 8px 12px;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(44,46,42,0.08);
    border-radius: 999px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
  }

  @media (max-width: 390px) {
    body {
      padding:
        calc(10px + env(safe-area-inset-top))
        calc(10px + env(safe-area-inset-right))
        calc(22px + env(safe-area-inset-bottom))
        calc(10px + env(safe-area-inset-left));
    }

    .app {
      max-width: 100%;
    }

    .head {
      margin: 2px 0 10px;
    }

    .logo {
      width: 100px;
    }

    .tag {
      margin-top: 4px;
    }

    .pwrap {
      margin: 0 0 10px;
    }

    .card {
      padding: 16px 14px 12px;
      border-radius: 20px;
    }

    h1 {
      font-size: clamp(20px, 6vw, 26px);
    }

    p.sub {
      margin: 0 0 12px;
    }

    .opt {
      min-height: 50px;
      padding: 9px 12px;
    }

    .opt .txt {
      font-size: 15px;
    }

    .options {
      gap: 8px;
    }

    .nav {
      gap: 8px;
      padding-top: 10px;
    }

    .btn.ghost,
    .btn:not(.ghost) {
      padding: 13px 14px;
      font-size: 15px;
    }

    .plan .ok {
      width: 42px;
      height: 42px;
      margin: 0 auto 4px;
    }

    .plan h1 {
      font-size: clamp(21px, 6vw, 26px);
      margin-top: 2px;
    }

    .plan .big {
      font-size: clamp(32px, 9.5vw, 46px);
    }

    .macros {
      gap: 6px;
    }

    .macros div {
      padding: 8px 4px 7px;
    }

    .macros b {
      font-size: 19px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="brand-wrap">
      <img class="logo" src="assets/logo.png" alt="FitTrack logo" />
    </div>
    <div class="tag" id="tagline"></div>
  </div>

  <div class="pwrap">
    <div class="ptop"><span id="stepLbl"></span><b id="pctLbl"></b></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="card" id="card"></div>
  <div class="nav" id="nav"></div>
</div>
<div class="toast" id="toast"></div>

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function showReward(i) {
  const msg = L.rewards[i];
  if (!msg) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showReward._t);
  showReward._t = setTimeout(() => toast.classList.remove("show"), 1600);
}

function setProgress() {
  const pct = Math.round((step / TOTAL) * 100);
  bar.style.width = pct + "%";
  stepLbl.textContent = `${L.step} ${step + 1} / ${TOTAL}`;
  pctLbl.textContent = `${pct}% ${L.done}`;
}

function go(next) {
  if (next > step && next <= TOTAL) showReward(step);
  step = next; persist(); render();
}

function navBtns(primaryLabel, onPrimary, opts) {
  opts = opts || {};
  nav.innerHTML = "";
  if (step > 0) {
    const b = document.createElement("button");
    b.className = "btn ghost"; b.textContent = L.back;
    b.onclick = () => go(step - 1);
    nav.appendChild(b);
  }
  if (opts.skip) {
    const s = document.createElement("button");
    s.className = "btn ghost"; s.textContent = L.skip; s.onclick = opts.skip;
    nav.appendChild(s);
  }
  const p = document.createElement("button");
  p.className = "btn" + (opts.cta ? " cta" : ""); p.id = "primary";
  p.textContent = primaryLabel; p.onclick = onPrimary;
  if (opts.disabled) p.disabled = true;
  nav.appendChild(p);
  return p;
}

function setPrimaryEnabled(on) { const p = document.getElementById("primary"); if (p) p.disabled = !on; }

function render() { 
  setProgress();
  const r = [renderName, renderGender, renderAge, renderHeight, renderWeight, renderActivity, renderGoal][step];
  r();
}

function renderName() {
  card.innerHTML = `<h1>${esc(L.q_name)}</h1><p class="sub">${esc(L.s_name)}</p>
    <div class="field"><label>${esc(L.first)}</label>
      <input id="fn" type="text" maxlength="64" value="${esc(data.first_name)}" autocomplete="given-name" />${TICK}</div>
    <div class="field"><label>${esc(L.last)}</label>
      <input id="ln" type="text" maxlength="64" value="${esc(data.last_name)}" autocomplete="family-name" />${TICK}</div>
    ${L.m_name ? `<p class="micro">${esc(L.m_name)}</p>` : ""}`;
  const fn = document.getElementById("fn"), ln = document.getElementById("ln");
  const ticks = card.querySelectorAll(".tick");
  const check = () => {
    const okF = fn.value.trim().length > 0, okL = ln.value.trim().length > 0;
    fn.classList.toggle("good", okF); ln.classList.toggle("good", okL);
    ticks[0].classList.toggle("show", okF); ticks[1].classList.toggle("show", okL);
    setPrimaryEnabled(okF && okL);
  };
  fn.addEventListener("input", check); ln.addEventListener("input", check);
  navBtns(L.next, () => {
    data.first_name = fn.value.trim(); data.last_name = ln.value.trim();
    if (!data.first_name || !data.last_name) return;
    persist(); go(step + 1);
  }, { disabled: true });
  check();
}

function renderNumber(key, title, sub, label, extraMicro) {
  card.innerHTML = `<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>
    <div class="field"><label>${esc(label)}</label>
      <input id="f" type="number" inputmode="decimal" value="${data[key] ?? ""}" />${TICK}
      <div class="ferr" id="fe"></div></div>${extraMicro ? `<p class="micro">${esc(extraMicro)}</p>` : ""}`;
  const f = document.getElementById("f"), fe = document.getElementById("fe"), tick = card.querySelector(".tick");
  const [min, max] = RANGES[key];
  const check = () => {
    const raw = f.value.trim();
    if (raw === "") { f.classList.remove("good","bad"); tick.classList.remove("show"); fe.textContent = ""; setPrimaryEnabled(false); return; }
    const v = parseFloat(raw);
    const ok = !isNaN(v) && v >= min && v <= max;
    f.classList.toggle("good", ok); f.classList.toggle("bad", !ok);
    tick.classList.toggle("show", ok);
    fe.textContent = ok ? "" : `${L.errRange}: ${min}–${max}`;
    setPrimaryEnabled(ok);
  };
  f.addEventListener("input", check);
  navBtns(L.next, () => {
    const v = parseFloat(f.value); if (isNaN(v) || v < min || v > max) return;
    data[key] = v; persist(); go(step + 1);
  }, { disabled: true });
  check();
}

function calcAgeFromBirthDate(date) {
  const now = new Date();
  const birth = new Date(date.year, date.month - 1, date.day);
  let age = now.getFullYear() - birth.getFullYear();
  const hasBirthdayPassed =
    now.getMonth() > birth.getMonth() ||
    (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
  if (!hasBirthdayPassed) age -= 1;
  return age;
}

function renderAge() {
  const curYear = new Date().getFullYear();
  let sd = 0, sm = 0, sy = 0;
  const savedMatch = String(data.birth_date || "").match(/^(\d{2})-(\d{2})-(\d{4})$/);
  if (savedMatch) { sd = +savedMatch[1]; sm = +savedMatch[2]; sy = +savedMatch[3]; }

  const opt = (v, label, sel) => `<option value="${v}"${sel ? " selected" : ""}>${esc(label)}</option>`;
  const dayOpts = [`<option value="" disabled${sd ? "" : " selected"}>${esc(L.dob_day)}</option>`];
  for (let d = 1; d <= 31; d++) dayOpts.push(opt(d, String(d).padStart(2, "0"), d === sd));
  const monthOpts = [`<option value="" disabled${sm ? "" : " selected"}>${esc(L.dob_month)}</option>`];
  for (let m = 1; m <= 12; m++) monthOpts.push(opt(m, L.months[m - 1], m === sm));
  const yearOpts = [`<option value="" disabled${sy ? "" : " selected"}>${esc(L.dob_year)}</option>`];
  for (let y = curYear - 10; y >= curYear - 100; y--) yearOpts.push(opt(y, String(y), y === sy));

  card.innerHTML = `<h1>${esc(L.q_age)}</h1><p class="sub">${esc(L.s_age)}</p>
    <div class="dob-grid">
      <div class="dob-box"><label>${esc(L.dob_day)}</label><select id="dob-d">${dayOpts.join("")}</select></div>
      <div class="dob-box"><label>${esc(L.dob_month)}</label><select id="dob-m">${monthOpts.join("")}</select></div>
      <div class="dob-box"><label>${esc(L.dob_year)}</label><select id="dob-y">${yearOpts.join("")}</select></div>
    </div>
    <div class="ferr" id="dob-fe"></div>`;

  const dEl = document.getElementById("dob-d");
  const mEl = document.getElementById("dob-m");
  const yEl = document.getElementById("dob-y");
  const fe = document.getElementById("dob-fe");
  let valid = null;

  const check = () => {
    valid = null;
    const day = +dEl.value, month = +mEl.value, year = +yEl.value;
    if (!day || !month || !year) { fe.textContent = ""; setPrimaryEnabled(false); return; }
    const dt = new Date(year, month - 1, day);
    const real = dt.getFullYear() === year && dt.getMonth() === month - 1 && dt.getDate() === day;
    if (!real) { fe.textContent = `${L.errRange}: ${L.age}`; setPrimaryEnabled(false); return; }
    const age = calcAgeFromBirthDate({ day, month, year });
    if (age < 10 || age > 100) { fe.textContent = `${L.errRange}: 10–100`; setPrimaryEnabled(false); return; }
    valid = { day, month, year, age };
    fe.textContent = "";
    setPrimaryEnabled(true);
  };

  [dEl, mEl, yEl].forEach(el => el.addEventListener("change", check));

  navBtns(L.next, () => {
    if (!valid) return;
    data.birth_date = `${String(valid.day).padStart(2, "0")}-${String(valid.month).padStart(2, "0")}-${valid.year}`;
    data.age = valid.age;
    persist();
    go(step + 1);
  }, { disabled: true });

  check();
}

function renderHeight() { renderNumber("height_cm", L.q_height, L.s_height, L.height); }
function renderWeight() { renderNumber("weight_kg", L.q_weight, L.s_weight, L.weight); }

function choiceStep(key, title, sub, items, finish) {
  card.innerHTML = `<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>
    <div class="options">${items.map(it => `
      <div class="opt ${data[key]===it.v?'sel':''}" data-v="${it.v}">
        ${it.ic ? `<span class="ic">${ICONS[it.ic]||""}</span>` : ""}
        <span class="txt">${esc(it.t)}${it.d ? `<small>${esc(it.d)}</small>` : ""}</span>
        <span class="rad"></span>
      </div>`).join("")}</div>`;
  card.querySelectorAll(".opt").forEach(el => el.onclick = () => {
    data[key] = el.dataset.v; persist();
    card.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o.dataset.v === data[key]));
    setPrimaryEnabled(true);
  });
  navBtns(finish ? L.finish : L.next, () => {
    if (!data[key]) return;
    if (finish) submit(); else go(step + 1);
  }, { disabled: !data[key], cta: !!finish });
}

let _calcTimer = null;
let _calcCount = null;
function showCalculating() {
  nav.innerHTML = "";
  card.innerHTML = `<div class="calc">
      <div class="ring"></div>
      <h1>${esc(L.calc_title)}</h1>
      <div class="cstep" id="cstep">${esc(L.calc_steps[0])}</div>
      <div class="cbar"><i id="cbari"></i></div>
    </div>`;
  requestAnimationFrame(() => { const b = document.getElementById("cbari"); if (b) b.style.width = "100%"; });

  // Rag'batlantirish: yuqoridagi progress 100% ga to'ladi
  stepLbl.textContent = "";
  bar.style.width = "100%";
  let pc = Math.round((step / TOTAL) * 100);
  pctLbl.textContent = `${pc}% ${L.done}`;
  _calcCount = setInterval(() => {
    pc = Math.min(100, pc + 2);
    pctLbl.textContent = `${pc}% ${L.done}`;
    if (pc >= 100) { clearInterval(_calcCount); _calcCount = null; }
  }, 45);

  // Bosqich matni silliq almashadi (fade + slide)
  let i = 0;
  const el = document.getElementById("cstep");
  _calcTimer = setInterval(() => {
    i = (i + 1) % L.calc_steps.length;
    if (!el) return;
    el.style.opacity = "0";
    el.style.transform = "translateY(6px)";
    setTimeout(() => {
      el.textContent = L.calc_steps[i];
      el.style.opacity = "1";
      el.style.transform = "translateY(0)";
    }, 300);
  }, 950);
}
function stopCalculating() {
  if (_calcTimer) { clearInterval(_calcTimer); _calcTimer = null; }
  if (_calcCount) { clearInterval(_calcCount); _calcCount = null; }
}

async function submit() {
  showCalculating();
  const minWait = new Promise(r => setTimeout(r, 2400));
  try {
    const initData = tg ? tg.initData : "";
    if (!initData) {
      const reason = !window.Telegram ? "SDK yuklanmadi"
        : !tg ? "WebApp yo'q"
        : (tg.initDataUnsafe && tg.initDataUnsafe.user) ? "imzosiz launch"
        : "kontekst yo'q";
      throw new Error(`initData bo'sh · ${reason} · v${tg?.version || "?"}/${tg?.platform || "?"}`);
    }
    const body = {
      init_data: initData,
      name: (data.first_name + " " + data.last_name).trim(),
      gender: data.gender, age: Math.round(data.age),
      height_cm: data.height_cm, weight_kg: data.weight_kg,
      activity: data.activity, goal: data.goal,
      waist_cm: data.waist_cm, neck_cm: data.neck_cm, hip_cm: data.hip_cm,
    };
    const res = await fetch("/api/onboarding", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = json?.detail;
      const msg = typeof detail === "string"
        ? detail
        : Array.isArray(detail)
          ? (detail[0]?.msg || L.errSend)
          : L.errSend;
      throw new Error(`${res.status} · ${msg}`);
    }
    await minWait;
    stopCalculating();
    clearStore();
    if (json.plan) return showPlan(json.plan);
    return showAlready();
  } catch (e) {
    stopCalculating();
    render();
    toast.textContent = e?.message || L.errSend;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2800);
  }
}

const OK_SVG = '<svg class="ok" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#1f9d55"/><path d="M20 33l8 8 16-18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function showAlready() {
  bar.style.width = "100%";
  stepLbl.textContent = ""; pctLbl.textContent = `100% ${L.done}`;
  card.innerHTML = `<div class="plan">${OK_SVG}<p class="sub" style="margin-top:8px">${esc(L.already)}</p></div>`;
  nav.innerHTML = ""; closeBtn();
}

function showPlan(plan) {
  bar.style.width = "100%";
  stepLbl.textContent = ""; pctLbl.textContent = `100% ${L.done}`;
  const bf = plan.body_fat_pct != null ? `<span class="chip">Body fat ${plan.body_fat_pct}%</span>` : "";
  card.innerHTML = `<div class="plan">${OK_SVG}
    <h1>${esc(L.planTitle)}</h1>
    <div class="big">${plan.target_kcal}</div>
    <div class="kc">${esc(L.kcalLabel)}</div>
    <div class="macros">
      <div><span class="mi">${ICONS.macro_protein}</span><b>${plan.macros.protein_g}g</b><span>${esc(L.protein)}</span></div>
      <div><span class="mi">${ICONS.macro_carb}</span><b>${plan.macros.carb_g}g</b><span>${esc(L.carb)}</span></div>
      <div><span class="mi">${ICONS.macro_fat}</span><b>${plan.macros.fat_g}g</b><span>${esc(L.fat)}</span></div>
    </div>
    <div class="chips"><span class="chip">BMI ${plan.bmi}</span><span class="chip">TDEE ${plan.tdee}</span>${bf}</div>
  </div>`;
  nav.innerHTML = ""; closeBtn();
}

function closeBtn() {
  const b = document.createElement("button");
  b.className = "btn cta"; b.textContent = L.close; b.onclick = () => { if (tg) tg.close(); };
  nav.appendChild(b);
}

render();
</script>
</body>
