<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitTrack</title>
<link rel="stylesheet" href="assets/css/app.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Yandex Advertising Network (RTB) loader -->
<script>window.yaContextCb = window.yaContextCb || [];</script>
<script src="https://yandex.ru/ads/system/context.js" async></script>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="brand-wrap">
      <img class="logo" src="assets/logo.png" alt="FitTrack logo" />
    </div>
    <div class="tag" id="tagline"></div>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <div class="menu-panel" id="menuPanel">
      <button class="menu-item" id="profileMenuItem" type="button"></button>
    </div>
  </div>

  <div class="pwrap">
    <div class="ptop"><span id="stepLbl"></span><b id="pctLbl"></b></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="card" id="card"></div>
  <div class="nav" id="nav"></div>
</div>
<div class="toast" id="toast"></div>

<!-- Yuklash tartibi muhim: har bir skript o'zidan oldingilarning
     doimiylarini (tg, L, ICONS, DOM referenslar...) ishlatadi. -->
<script src="assets/js/telegram.js"></script>
<script src="assets/js/i18n.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/state.js"></script>
<script src="assets/js/ads.js"></script>
<script src="assets/js/onboarding.js"></script>
<script src="assets/js/profile.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
