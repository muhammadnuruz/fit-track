<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitTrack</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --green: #24a25a;
    --green-d: #1b8049;
    --navy: #1e4c9a;
    --navy-d: #163a75;
    --bg: #eef3f8;
    --card: #ffffff;
    --text: #14213d;
    --hint: #6b7a90;
    --border: #e1e8f0;
    --ok: #24a25a;
    --err: #e5484d;
    --shadow: 0 10px 30px rgba(20, 33, 61, 0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(1200px 500px at 50% -10%, rgba(36, 162, 90, 0.10), transparent 60%),
      radial-gradient(1000px 500px at 50% 110%, rgba(30, 76, 154, 0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    display: flex; justify-content: center;
    padding: 16px;
  }
  .app { width: 100%; max-width: 460px; }
  .head { display: flex; flex-direction: column; align-items: center; margin: 8px 0 14px; }
  .logo { width: 68px; height: 64px; }
  .brand { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-top: 6px; color: var(--navy); }
  .brand .g { color: var(--green); }
  .tag { font-size: 13px; color: var(--hint); margin-top: 2px; }

  .pwrap { margin: 6px 0 16px; }
  .ptop { display: flex; justify-content: space-between; font-size: 12px; color: var(--hint); margin-bottom: 6px; }
  .ptop b { color: var(--green-d); }
  .bar { height: 8px; background: #dde6ef; border-radius: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0;
    background: linear-gradient(90deg, var(--green), var(--navy)); transition: width .4s cubic-bezier(.4,0,.2,1); }

  .card {
    background: var(--card); border-radius: 20px; padding: 22px 20px;
    box-shadow: var(--shadow); animation: rise .35s ease both;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  h1 { font-size: 21px; margin: 0 0 4px; letter-spacing: -0.3px; }
  p.sub { color: var(--hint); font-size: 14px; margin: 0 0 18px; line-height: 1.4; }

  .field { position: relative; margin-bottom: 12px; }
  label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 6px; font-weight: 500; }
  input {
    width: 100%; padding: 15px 44px 15px 15px; font-size: 17px; border-radius: 14px;
    border: 1.5px solid var(--border); background: #fbfcfe; color: var(--text); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus { border-color: var(--navy); box-shadow: 0 0 0 4px rgba(30, 76, 154, 0.10); }
  input.good { border-color: var(--green); }
  input.bad { border-color: var(--err); }
  .tick { position: absolute; right: 14px; top: 39px; width: 22px; height: 22px; opacity: 0; transform: scale(.6); transition: .2s; }
  .tick.show { opacity: 1; transform: scale(1); }
  .micro { font-size: 12px; color: var(--hint); margin: 4px 2px 0; }
  .ferr { font-size: 12px; color: var(--err); margin: 5px 2px 0; min-height: 14px; }

  .options { display: grid; gap: 10px; }
  .opt {
    display: flex; align-items: center; gap: 12px;
    padding: 15px 16px; border-radius: 14px; border: 2px solid var(--border);
    background: #fbfcfe; cursor: pointer; transition: .15s; font-size: 16px; font-weight: 600;
  }
  .opt small { display: block; color: var(--hint); font-size: 12px; font-weight: 400; margin-top: 2px; }
  .opt .ic { font-size: 22px; line-height: 1; }
  .opt .txt { flex: 1; }
  .opt .rad { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--border); flex: none; position: relative; }
  .opt.sel { border-color: var(--green); background: rgba(36, 162, 90, 0.06); }
  .opt.sel .rad { border-color: var(--green); }
  .opt.sel .rad::after { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--green); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  .nav { display: flex; gap: 10px; margin-top: 20px; }
  button.btn {
    flex: 1; padding: 16px; font-size: 16px; font-weight: 700; border: none; border-radius: 14px;
    color: #fff; cursor: pointer; transition: .15s; letter-spacing: .2px;
    background: linear-gradient(135deg, var(--navy), var(--navy-d));
  }
  button.cta { background: linear-gradient(135deg, var(--green), var(--navy)); box-shadow: 0 8px 20px rgba(30, 76, 154, .25); }
  button.ghost { flex: 0 0 auto; padding: 16px 18px; background: #fff; color: var(--navy); border: 1.5px solid var(--border); }
  button.btn:disabled { opacity: .45; cursor: default; box-shadow: none; }
  button.btn:active:not(:disabled) { transform: translateY(1px); }

  .toast {
    position: fixed; left: 50%; top: 14px; transform: translate(-50%, -80px);
    background: var(--green-d); color: #fff; padding: 11px 18px; border-radius: 999px;
    font-size: 14px; font-weight: 600; box-shadow: var(--shadow); opacity: 0; transition: .35s; z-index: 9;
  }
  .toast.show { transform: translate(-50%, 0); opacity: 1; }

  .plan { text-align: center; }
  .plan .ok { width: 64px; height: 64px; margin: 4px auto 8px; animation: pop .5s ease both; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
  .plan .big { font-size: 40px; font-weight: 800; color: var(--navy); margin: 6px 0 0; }
  .plan .kc { color: var(--hint); font-size: 14px; }
  .macros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 22px 0 6px; }
  .macros div { background: #f4f8fb; border-radius: 14px; padding: 14px 6px; }
  .macros b { display: block; font-size: 19px; color: var(--green-d); }
  .macros span { color: var(--hint); font-size: 12px; }
  .chips { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .chip { background: #eef3f8; border-radius: 999px; padding: 6px 12px; font-size: 13px; color: var(--navy); font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <svg class="logo" viewBox="0 0 64 60" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M32,55 C6,39 4,18 18,13 C26,10 31,14 32,20 C33,14 38,10 46,13 C60,18 58,39 32,55 Z"
            fill="none" stroke="#24a25a" stroke-width="4" stroke-linejoin="round"/>
      <polyline points="7,31 20,31 25,20 31,44 36,31 57,31"
                fill="none" stroke="#1e4c9a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div class="brand">Fit<span class="g">Track</span></div>
    <div class="tag" id="tagline"></div>
  </div>

  <div class="pwrap">
    <div class="ptop"><span id="stepLbl"></span><b id="pctLbl"></b></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="card" id="card"></div>
  <div class="nav" id="nav"></div>
</div>
<div class="toast" id="toast"></div>

<script>

    g_bulk: "Набор массы", g_bulk_d: "Растить мышцы",

    rewards: ["Отличный старт! 🎉","Супер! 👏","Продолжаем 💪","Больше половины! 🔥","Отлично идёте! ⭐","Немного осталось! 🚀","Почти готово! ✨"],
    planTitle: "Ваш план готов!", kcalLabel: "калорий в день",

  },
  en: {
    tagline: "Your companion on the way to health",
    step: "Step", of: "of", done: "completed",
    q_name: "Nice to meet you", s_name: "We'll greet you by your name.",
    first: "First name", last: "Last name", m_name: "Used only to address you personally.",
    q_gender: "Gender", s_gender: "Calorie math depends on gender.", male: "Male", female: "Female",
    q_age: "Age", s_age: "Metabolism changes with age.", age: "Age (full years)",

    q_weight: "Weight", s_weight: "Enter your current weight.", weight: "Weight (kg)",
    q_activity: "Activity level", s_activity: "Pick your real level.",
    a_sedentary: "Sedentary", a_sedentary_d: "Office job, no sport",
    a_light: "Light", a_light_d: "1-3 workouts per week",
    a_moderate: "Moderate", a_moderate_d: "3-5 workouts per week",
    a_active: "Active", a_active_d: "6-7 workouts per week",
    a_very_active: "Very active", a_very_active_d: "Hard labor / twice a day",
    q_goal: "Your goal", s_goal: "We'll tailor the plan.",
    g_cut: "Lose weight", g_cut_d: "Burn fat", g_maintain: "Maintain", g_maintain_d: "Stay in shape",
    g_bulk: "Gain muscle", g_bulk_d: "Build muscle",
    q_measures: "Body measurements", s_measures: "For a precise body-fat estimate — optional.",
    waist: "Waist (cm)", neck: "Neck (cm)", hip: "Hip (cm)",
    m_measures: "The plan works even if you skip these.",
    hipNote: "For women, hip measurement is needed for body fat.",
    back: "Back", next: "Continue", skip: "Skip", finish: "Create account & start",
    rewards: ["Great start! 🎉","Awesome! 👏","Keep going 💪","Over halfway! 🔥","Doing great! ⭐","Almost there! 🚀","Nearly done! ✨"],
    planTitle: "Your plan is ready!", kcalLabel: "daily calories",
    protein: "Protein", carb: "Carbs", fat: "Fat", close: "Close",
    already: "You are already registered.",
    errReq: "Required", errRange: "Range",
    errSend: "Error, please try again", sending: "Creating...",
  },
};
const L = T[LANG];
document.getElementById("tagline").textContent = L.tagline;

const LS_KEY = "fittrack_onb_" + (tgUser.id || "anon");
const RANGES = { age: [10, 100], height_cm: [100, 250], weight_kg: [30, 350] };

const data = {
  first_name: tgUser.first_name || "", last_name: tgUser.last_name || "",
  gender: null, age: null, height_cm: null, weight_kg: null,
  activity: "moderate", goal: null, waist_cm: null, neck_cm: null, hip_cm: null,
};
let step = 0;

(function restore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      Object.assign(data, saved.data || {});
      if (typeof saved.step === "number" && saved.step >= 0 && saved.step < 8) step = saved.step;
    }
  } catch (e) {}
})();
function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify({ data, step })); } catch (e) {} }
function clearStore() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }

const TOTAL = 8;
const card = document.getElementById("card");
const nav = document.getElementById("nav");
const bar = document.getElementById("bar");
const stepLbl = document.getElementById("stepLbl");
const pctLbl = document.getElementById("pctLbl");
const toast = document.getElementById("toast");

const TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#24a25a"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function showReward(i) {
  const msg = L.rewards[i];
  if (!msg) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showReward._t);
  showReward._t = setTimeout(() => toast.classList.remove("show"), 1600);
}

function setProgress() {
  const pct = Math.round((step / TOTAL) * 100);
  bar.style.width = pct + "%";
  stepLbl.textContent = `${L.step} ${step + 1} / ${TOTAL}`;
  pctLbl.textContent = `${pct}% ${L.done}`;
}

function go(next) {
  if (next > step && next <= TOTAL) showReward(step);
  step = next; persist(); render();
}

function navBtns(primaryLabel, onPrimary, opts) {
  opts = opts || {};
  nav.innerHTML = "";
  if (step > 0) {
    const b = document.createElement("button");
    b.className = "btn ghost"; b.textContent = L.back;
    b.onclick = () => go(step - 1);
    nav.appendChild(b);
  }
  if (opts.skip) {
    const s = document.createElement("button");
    s.className = "btn ghost"; s.textContent = L.skip; s.onclick = opts.skip;
    nav.appendChild(s);
  }
  const p = document.createElement("button");
  p.className = "btn" + (opts.cta ? " cta" : ""); p.id = "primary";
  p.textContent = primaryLabel; p.onclick = onPrimary;
  if (opts.disabled) p.disabled = true;
  nav.appendChild(p);
  return p;
}
function setPrimaryEnabled(on) { const p = document.getElementById("primary"); if (p) p.disabled = !on; }

function render() {
  setProgress();
  const r = [renderName, renderGender, renderAge, renderHeight, renderWeight, renderActivity, renderGoal, renderMeasures][step];
  r();
}

function renderName() {
  card.innerHTML = `<h1>${esc(L.q_name)}</h1><p class="sub">${esc(L.s_name)}</p>
    <div class="field"><label>${esc(L.first)}</label>
      <input id="fn" type="text" maxlength="64" value="${esc(data.first_name)}" autocomplete="given-name" />${TICK}</div>
    <div class="field"><label>${esc(L.last)}</label>
      <input id="ln" type="text" maxlength="64" value="${esc(data.last_name)}" autocomplete="family-name" />${TICK}</div>
    <p class="micro">${esc(L.m_name)}</p>`;
  const fn = document.getElementById("fn"), ln = document.getElementById("ln");
  const ticks = card.querySelectorAll(".tick");
  const check = () => {
    const okF = fn.value.trim().length > 0, okL = ln.value.trim().length > 0;
    fn.classList.toggle("good", okF); ln.classList.toggle("good", okL);
    ticks[0].classList.toggle("show", okF); ticks[1].classList.toggle("show", okL);
    setPrimaryEnabled(okF && okL);
  };
  fn.addEventListener("input", check); ln.addEventListener("input", check);
  navBtns(L.next, () => {
    data.first_name = fn.value.trim(); data.last_name = ln.value.trim();
    if (!data.first_name || !data.last_name) return;
    persist(); go(step + 1);
  }, { disabled: true });
  check();
}

function renderNumber(key, title, sub, label, extraMicro) {
  card.innerHTML = `<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>
    <div class="field"><label>${esc(label)}</label>
      <input id="f" type="number" inputmode="decimal" value="${data[key] ?? ""}" />${TICK}
      <div class="ferr" id="fe"></div></div>${extraMicro ? `<p class="micro">${esc(extraMicro)}</p>` : ""}`;
  const f = document.getElementById("f"), fe = document.getElementById("fe"), tick = card.querySelector(".tick");
  const [min, max] = RANGES[key];
  const check = () => {
    const raw = f.value.trim();
    if (raw === "") { f.classList.remove("good","bad"); tick.classList.remove("show"); fe.textContent = ""; setPrimaryEnabled(false); return; }
    const v = parseFloat(raw);
    const ok = !isNaN(v) && v >= min && v <= max;
    f.classList.toggle("good", ok); f.classList.toggle("bad", !ok);
    tick.classList.toggle("show", ok);
    fe.textContent = ok ? "" : `${L.errRange}: ${min}–${max}`;
    setPrimaryEnabled(ok);
  };
  f.addEventListener("input", check);
  navBtns(L.next, () => {
    const v = parseFloat(f.value); if (isNaN(v) || v < min || v > max) return;
    data[key] = v; persist(); go(step + 1);
  }, { disabled: true });
  check();
}
function renderAge() { renderNumber("age", L.q_age, L.s_age, L.age); }
function renderHeight() { renderNumber("height_cm", L.q_height, L.s_height, L.height); }
function renderWeight() { renderNumber("weight_kg", L.q_weight, L.s_weight, L.weight); }

function choiceStep(key, title, sub, items) {
  card.innerHTML = `<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>
    <div class="options">${items.map(it => `
      <div class="opt ${data[key]===it.v?'sel':''}" data-v="${it.v}">
        ${it.ic ? `<span class="ic">${it.ic}</span>` : ""}
        <span class="txt">${esc(it.t)}${it.d ? `<small>${esc(it.d)}</small>` : ""}</span>
        <span class="rad"></span>
      </div>`).join("")}</div>`;
  card.querySelectorAll(".opt").forEach(el => el.onclick = () => {
    data[key] = el.dataset.v; persist();
    card.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o.dataset.v === data[key]));
    setPrimaryEnabled(true);
  });
  navBtns(L.next, () => { if (!data[key]) return; go(step + 1); }, { disabled: !data[key] });
}

function renderGender() {
  choiceStep("gender", L.q_gender, L.s_gender, [
    { v: "male", t: L.male, ic: "👨" }, { v: "female", t: L.female, ic: "👩" },
  ]);
}
function renderActivity() {
  choiceStep("activity", L.q_activity, L.s_activity, ["sedentary","light","moderate","active","very_active"].map(v =>
    ({ v, t: L["a_"+v], d: L["a_"+v+"_d"] })));
}
function renderGoal() {
  choiceStep("goal", L.q_goal, L.s_goal, [
    { v: "cut", t: L.g_cut, d: L.g_cut_d, ic: "🔻" },
    { v: "maintain", t: L.g_maintain, d: L.g_maintain_d, ic: "⚖️" },
    { v: "bulk", t: L.g_bulk, d: L.g_bulk_d, ic: "🔺" },
  ]);
}

function renderMeasures() {
  const hipNote = data.gender === "female" ? `<p class="micro">${esc(L.hipNote)}</p>` : "";
  card.innerHTML = `<h1>${esc(L.q_measures)}</h1><p class="sub">${esc(L.s_measures)}</p>
    <div class="row">
      <div class="field"><label>${esc(L.waist)}</label><input id="waist" type="number" inputmode="decimal" value="${data.waist_cm ?? ""}" /></div>
      <div class="field"><label>${esc(L.neck)}</label><input id="neck" type="number" inputmode="decimal" value="${data.neck_cm ?? ""}" /></div>
    </div>
    <div class="row"><div class="field"><label>${esc(L.hip)}</label><input id="hip" type="number" inputmode="decimal" value="${data.hip_cm ?? ""}" /></div></div>
    ${hipNote}<p class="micro">${esc(L.m_measures)}</p>`;
  const grab = () => {
    data.waist_cm = pn("waist", 30, 250); data.neck_cm = pn("neck", 15, 100); data.hip_cm = pn("hip", 40, 250);
    persist();
  };
  ["waist","neck","hip"].forEach(id => document.getElementById(id).addEventListener("input", grab));
  navBtns(L.finish, () => { grab(); submit(); }, { cta: true, skip: () => {
    data.waist_cm = data.neck_cm = data.hip_cm = null; persist(); submit();
  }});
}
function pn(id, min, max) {
  const el = document.getElementById(id); if (!el || el.value.trim() === "") return null;
  const v = parseFloat(el.value); return (isNaN(v) || v < min || v > max) ? null : v;
}

async function submit() {
  bar.style.width = "100%";
  nav.querySelectorAll("button").forEach(b => b.disabled = true);
  const p = document.getElementById("primary"); if (p) p.textContent = L.sending;
  const body = {
    init_data: tg ? tg.initData : "",
    name: (data.first_name + " " + data.last_name).trim(),
    gender: data.gender, age: Math.round(data.age),
    height_cm: data.height_cm, weight_kg: data.weight_kg,
    activity: data.activity, goal: data.goal,
    waist_cm: data.waist_cm, neck_cm: data.neck_cm, hip_cm: data.hip_cm,
  };
  try {
    const res = await fetch("/api/onboarding", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("http " + res.status);
    const json = await res.json();
    clearStore();
    if (json.already) return showAlready();
    showPlan(json.plan);
  } catch (e) {
    nav.querySelectorAll("button").forEach(b => b.disabled = false);
    if (p) p.textContent = L.finish;
    toast.textContent = L.errSend; toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }
}

const OK_SVG = '<svg class="ok" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#24a25a"/><path d="M20 33l8 8 16-18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function showAlready() {
  setProgress(); bar.style.width = "100%";
  card.innerHTML = `<div class="plan">${OK_SVG}<p class="sub" style="margin-top:8px">${esc(L.already)}</p></div>`;
  nav.innerHTML = ""; closeBtn();
}

function showPlan(plan) {
  bar.style.width = "100%";
  stepLbl.textContent = ""; pctLbl.textContent = `100% ${L.done}`;
  const bf = plan.body_fat_pct != null ? `<span class="chip">🧬 ${plan.body_fat_pct}%</span>` : "";
  card.innerHTML = `<div class="plan">${OK_SVG}
    <h1>${esc(L.planTitle)}</h1>
    <div class="big">${plan.target_kcal}</div>
    <div class="kc">${esc(L.kcalLabel)}</div>
    <div class="macros">
      <div><b>${plan.macros.protein_g}g</b><span>${esc(L.protein)}</span></div>
      <div><b>${plan.macros.carb_g}g</b><span>${esc(L.carb)}</span></div>
      <div><b>${plan.macros.fat_g}g</b><span>${esc(L.fat)}</span></div>
    </div>
    <div class="chips"><span class="chip">BMI ${plan.bmi}</span><span class="chip">TDEE ${plan.tdee}</span>${bf}</div>
  </div>`;
  nav.innerHTML = ""; closeBtn();
  if (tg) setTimeout(() => tg.close(), 4000);
}

function closeBtn() {
  const b = document.createElement("button");
  b.className = "btn cta"; b.textContent = L.close; b.onclick = () => { if (tg) tg.close(); };
  nav.appendChild(b);
}

render();
</script>
</body>
</html>
