<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Yandex Advertising Network (RTB) loader -->
<script>window.yaContextCb = window.yaContextCb || [];</script>
<script src="https://yandex.ru/ads/system/context.js" async></script>
<style>
  :root {
    --paper: #f6f1ea;
    --paper-strong: #efe7db;
    --card: #ffffff;
    --card-2: #ffffff;
    --ink: #1a1917;
    --ink-soft: #5d574f;
    --line: rgba(26,25,23,0.10);
    --green: #1f9d55;
    --green-deep: #17864a;
    --navy: #1e4c9a;
    --coral: #ff705d;
    --amber: #f5b301;
    --sky: #2ba0ff;
    --bad: #e0533f;
    --shadow: 0 12px 28px rgba(26,25,23,0.04);
    --radius-xl: 30px;
    --radius-lg: 20px;
    --radius-md: 15px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    padding:
      calc(12px + env(safe-area-inset-top))
      calc(16px + env(safe-area-inset-right))
      calc(14px + env(safe-area-inset-bottom))
      calc(16px + env(safe-area-inset-left));
  }

  .app {
    width: 100%;
    max-width: 440px;
    height: 100%;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .head {
    position: relative;
    flex: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 2px 0 12px;
  }

  .brand-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0;
    border-radius: 999px;
    background: transparent;
    border: none;
  }

  .logo {
    width: 142px;
    height: auto;
    display: block;
    flex: none;
    background: transparent;
  }

  .brand {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.06em;
    color: var(--ink);
  }

  .brand .g {
    color: var(--green);
  }

  .tag {
    margin-top: 6px;
    color: var(--ink-soft);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    font-weight: 600;
  }

  .menu-btn {
    position: absolute;
    top: 0;
    right: 0;
    display: none;
    width: 40px;
    height: 40px;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
  }

  .menu-btn svg { width: 20px; height: 20px; }

  .menu-panel {
    position: absolute;
    z-index: 4;
    top: 46px;
    right: 0;
    display: none;
    min-width: 150px;
    padding: 6px;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
    box-shadow: 0 12px 28px rgba(26,25,23,0.12);
  }

  .menu-panel.open { display: block; }

  .menu-item {
    width: 100%;
    padding: 10px 12px;
    border: 0;
    border-radius: 9px;
    background: transparent;
    color: var(--ink);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }

  .menu-item:hover { background: var(--paper-strong); }

  .pwrap {
    flex: none;
    margin: 0 0 12px;
  }

  .ptop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .ptop b {
    color: var(--green);
    font-weight: 700;
  }

  .bar {
    height: 10px;
    background: rgba(44,46,42,0.08);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }

  .bar > i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--green) 0%, var(--navy) 100%);
    transition: width 0.35s ease;
  }

  .card {
    flex: 0 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    margin: auto 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 22px;
    padding: 20px 16px 18px;
    box-shadow: none;
    animation: rise 0.35s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 4.6vw, 30px);
    line-height: 1.08;
    letter-spacing: -0.06em;
    font-weight: 700;
  }

  p.sub {
    margin: 0 0 14px;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.45;
  }

  .field {
    position: relative;
    margin-bottom: 14px;
  }

  .dob-grid {
    display: grid;
    grid-template-columns: 0.8fr 1.55fr 1.05fr;
    gap: 8px;
    margin-top: 6px;
  }

  .dob-box {
    position: relative;
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 10px 6px 8px;
    min-height: 62px;
  }

  .dob-box::after {
    content: "";
    position: absolute;
    right: 7px;
    bottom: 15px;
    width: 6px;
    height: 6px;
    border-right: 2px solid var(--ink-soft);
    border-bottom: 2px solid var(--ink-soft);
    transform: rotate(45deg);
    opacity: 0.45;
    pointer-events: none;
  }

  .dob-box label {
    display: block;
    margin-bottom: 6px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .dob-box input,
  .dob-box select {
    width: 100%;
    border: none;
    background: transparent;
    padding: 0;
    font-size: 16px;
    color: var(--ink);
    text-align: center;
    outline: none;
  }

  .dob-box select {
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    text-align-last: center;
    padding: 0 14px 0 2px;
    cursor: pointer;
    text-overflow: ellipsis;
  }

  .dob-box input::placeholder {
    color: rgba(44,46,42,0.35);
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }

  input {
    width: 100%;
    padding: 16px 48px 16px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.8);
    color: var(--ink);
    font-size: 17px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }

  input:focus {
    border-color: var(--navy);
    box-shadow: 0 0 0 4px rgba(30,76,154,0.12);
  }

  input.good {
    border-color: var(--green);
    box-shadow: 0 0 0 4px rgba(31,157,85,0.12);
  }

  input.bad {
    border-color: var(--bad);
    box-shadow: 0 0 0 4px rgba(224,83,63,0.10);
  }

  input[type=number] { -moz-appearance: textfield; }
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  .tick {
    position: absolute;
    right: 13px;
    top: 40px;
    width: 22px;
    height: 22px;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .tick.show {
    opacity: 1;
    transform: scale(1);
  }

  .micro, .ferr {
    margin: 4px 2px 0;
    font-size: 12px;
    line-height: 1.4;
  }

  .micro {
    color: var(--ink-soft);
  }

  .ferr {
    color: #c14c3d;
    min-height: 18px;
  }

  .options {
    display: grid;
    gap: 10px;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 54px;
    padding: 10px 14px;
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  .opt .ic {
    flex: none;
    width: 44px;
    height: 44px;
    border-radius: 13px;
    background: rgba(31,157,85,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .opt .ic svg {
    width: 26px;
    height: 26px;
    display: block;
  }

  .opt:hover { transform: translateY(-1px); }

  .opt .txt {
    flex: 1;
    min-width: 0;
    font-size: 16px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .opt small {
    display: block;
    margin-top: 3px;
    color: var(--ink-soft);
    font-weight: 500;
    font-size: 12px;
    line-height: 1.4;
  }

  .opt .rad {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(27, 26, 24, 0.28);
    position: relative;
    flex: none;
  }

  .opt.sel {
    border-color: var(--green);
    background: rgba(31,157,85,0.06);
  }

  .opt.sel .rad {
    border-color: var(--green);
  }

  .opt.sel .rad::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--green);
  }

  .nav {
    flex: none;
    display: flex;
    align-items: center;
    gap: 12px;
    padding-top: 12px;
  }

  button.btn {
    appearance: none;
    border: 0;
    font: inherit;
    cursor: pointer;
    border-radius: 999px;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn.ghost {
    flex: 0 0 auto;
    padding: 14px 18px;
    background: rgba(255,255,255,0.42);
    border: 1px solid rgba(44,46,42,0.08);
    color: var(--ink);
    font-weight: 600;
  }

  .btn:not(.ghost) {
    flex: 1;
    padding: 15px 18px;
    background: linear-gradient(135deg, var(--green) 0%, var(--navy) 100%);
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.02em;
    box-shadow: none;
    text-transform: none;
  }

  .btn.cta {
    background: linear-gradient(135deg, var(--green) 0%, var(--navy) 100%);
    box-shadow: none;
  }

  .toast {
    position: fixed;
    left: 50%;
    top: calc(16px + env(safe-area-inset-top));
    transform: translate(-50%, -80px);
    background: rgba(44,46,42,0.94);
    color: #fff;
    padding: 12px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    box-shadow: var(--shadow);
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
    z-index: 9;
  }

  .toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
  }

  .plan {
    text-align: center;
  }

  .plan .ok {
    width: 48px;
    height: 48px;
    margin: 0 auto 6px;
    animation: pop 0.42s ease both;
  }

  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .plan h1 {
    font-size: clamp(23px, 5.6vw, 32px);
    margin-top: 4px;
  }

  .plan .big {
    margin-top: 6px;
    font-size: clamp(36px, 9.5vw, 52px);
    line-height: 0.9;
    font-weight: 800;
    letter-spacing: -0.08em;
    color: var(--ink);
  }

  .plan .kc {
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .macros {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 8px;
    margin-top: 12px;
  }

  .macros div {
    background: var(--card-2);
    border: 1px solid rgba(44,46,42,0.08);
    border-radius: 18px;
    padding: 10px 6px 9px;
  }

  .macros b {
    display: block;
    font-size: 21px;
    letter-spacing: -0.06em;
    color: var(--green);
  }

  .macros .mi {
    display: flex;
    justify-content: center;
    margin-bottom: 4px;
  }

  .macros .mi svg {
    width: 22px;
    height: 22px;
  }

  .macros span {
    display: block;
    margin-top: 2px;
    color: var(--ink-soft);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .calc {
    text-align: center;
    padding: 8px 0 6px;
  }

  .calc .ring {
    width: 78px;
    height: 78px;
    margin: 6px auto 18px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--green), var(--navy), var(--sky), var(--green));
    -webkit-mask: radial-gradient(farthest-side, #0000 calc(100% - 8px), #000 calc(100% - 8px));
    mask: radial-gradient(farthest-side, #0000 calc(100% - 8px), #000 calc(100% - 8px));
    animation: spin 0.85s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .calc h1 {
    font-size: clamp(21px, 4.6vw, 27px);
    margin-bottom: 10px;
  }

  .calc .cstep {
    color: var(--ink-soft);
    font-size: 14px;
    min-height: 20px;
    margin-bottom: 18px;
    transition: opacity 0.3s ease, transform 0.3s ease;
  }

  .calc .cbar {
    height: 8px;
    width: 80%;
    max-width: 240px;
    margin: 0 auto;
    background: rgba(44,46,42,0.08);
    border-radius: 999px;
    overflow: hidden;
  }

  .calc .cbar > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: linear-gradient(90deg, var(--green), var(--navy));
    transition: width 2.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .chips {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 8px 12px;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(44,46,42,0.08);
    border-radius: 999px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
  }

  @media (max-width: 390px) {
    body {
      padding:
        calc(10px + env(safe-area-inset-top))
        calc(10px + env(safe-area-inset-right))
        calc(22px + env(safe-area-inset-bottom))
        calc(10px + env(safe-area-inset-left));
    }

    .app {
      max-width: 100%;
    }

    .head {
      margin: 2px 0 10px;
    }

    .logo {
        width: 132px;
    }

    .tag {
      margin-top: 4px;
    }

    .pwrap {
      margin: 0 0 10px;
    }

    .card {
      padding: 16px 14px 12px;
      border-radius: 20px;
    }

    h1 {
      font-size: clamp(20px, 6vw, 26px);
    }

    p.sub {
      margin: 0 0 12px;
    }

    .opt {
      min-height: 50px;
      padding: 9px 12px;
    }

    .opt .txt {
      font-size: 15px;
    }

    .options {
      gap: 8px;
    }

    .nav {
      gap: 8px;
      padding-top: 10px;
    }

    .btn.ghost,
    .btn:not(.ghost) {
      padding: 13px 14px;
      font-size: 15px;
    }

    .plan .ok {
      width: 42px;
      height: 42px;
      margin: 0 auto 4px;
    }

    .plan h1 {
      font-size: clamp(21px, 6vw, 26px);
      margin-top: 2px;
    }

    .plan .big {
      font-size: clamp(32px, 9.5vw, 46px);
    }

    .macros {
      gap: 6px;
    }

    .macros div {
      padding: 8px 4px 7px;
    }

    .macros b {
      font-size: 19px;
    }
  }
</style>
</head>
<body>
<div class="app">
  <div class="head">
    <div class="brand-wrap">
      <img class="logo" src="assets/logo.png" alt="FitTrack logo" />
    </div>
    <div class="tag" id="tagline"></div>
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
    <div class="menu-panel" id="menuPanel">
      <button class="menu-item" id="profileMenuItem" type="button"></button>
    </div>
  </div>

  <div class="pwrap">
    <div class="ptop"><span id="stepLbl"></span><b id="pctLbl"></b></div>
    <div class="bar"><i id="bar"></i></div>
  </div>

  <div class="card" id="card"></div>
  <div class="nav" id="nav"></div>
</div>
<div class="toast" id="toast"></div>

<style>
  .dashboard-card { padding: 12px 2px 8px; background: transparent; border: 0; }
  .dash { display: flex; flex-direction: column; gap: 12px; }
  .dhead { display: flex; align-items: center; gap: 12px; padding: 0 4px; }
  .avwrap { position: relative; flex: none; }
  .avatar {
    width: 54px; height: 54px; border-radius: 50%; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 23px; color: #fff; background: var(--green);
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .avedit {
    position: absolute; right: -2px; bottom: -2px; width: 26px; height: 26px;
    border-radius: 50%; border: 2px solid var(--paper); background: var(--ink);
    color: #fff; display: flex; align-items: center; justify-content: center;
    cursor: pointer; padding: 0;
  }
  .avedit svg { width: 13px; height: 13px; }
  .dname { min-width: 0; }
  .nrow { display: flex; align-items: center; gap: 8px; }
  .nrow #nameTxt { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; }
  .lnk {
    border: none; background: transparent; color: var(--ink-soft); cursor: pointer;
    padding: 4px; display: inline-flex; align-items: center;
  }
  .lnk svg { width: 16px; height: 16px; }
  .ninp {
    font-size: 18px; font-weight: 700; padding: 4px 8px; border: 1px solid var(--line);
    border-radius: var(--radius-md); background: var(--card); color: var(--ink); width: 160px;
  }
  .limitCard {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 16px 12px 14px; text-align: center;
  }
  .ph {
    border: 1px dashed var(--line); border-radius: 14px; padding: 16px;
    text-align: center; color: var(--ink-soft); font-size: 14px;
  }
  .edit { display: flex; flex-direction: column; gap: 10px; }
  .edit h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: -0.02em; }
  .erow {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md);
    padding: 12px 14px;
  }
  .erow > label { color: var(--ink-soft); font-size: 14px; font-weight: 600; flex: none; }
  .erow input {
    width: 120px; text-align: right; font-size: 16px; font-weight: 700; border: none;
    background: transparent; color: var(--ink); padding: 4px 0;
  }
  .erow input:focus { outline: none; }
  .chipsel { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .csel {
    border: 1px solid var(--line); background: var(--paper-strong); color: var(--ink-soft);
    border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .csel.on { background: var(--green); border-color: var(--green); color: #fff; }
</style>

<script>
const tg = window.Telegram ? window.Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); }

// Yandex RTB blok ID (Yandex kabinetidan: R-A-XXXXXXX-N). Bo'sh bo'lsa reklama render bo'lmaydi.
const YA_BLOCK_ID = "R-A-20020837-1";
// Fullscreen (chiqishda) reklama uchun ALOHIDA Yandex unit ID. Bo'sh bo'lsa oddiy yopiladi.
const YA_FULLSCREEN_ID = "R-A-20020837-2";
function renderAd(containerId) {
  if (!YA_BLOCK_ID || typeof window.Ya === "undefined") return;
  window.yaContextCb.push(() => {
    try {
      window.Ya.Context.AdvManager.render({ blockId: YA_BLOCK_ID, renderTo: containerId });

function closeWithExitAd() {
  if (!tg) return;
  // Reklama allaqachon ko'rsatilgan bo'lsa (2-bosish) yoki ID yo'q bo'lsa — to'g'ridan-to'g'ri yopamiz.
  if (_exitAdShown || !YA_FULLSCREEN_ID || typeof window.Ya === "undefined") { tg.close(); return; }
  _exitAdShown = true;
  let done = false, rendered = false;
  const finish = () => { if (done) return; done = true; tg.close(); };
  window.yaContextCb.push(() => {
    try {
      const plat = /android|ios|iphone|ipad/i.test((tg && tg.platform) || "") ? "touch"
        : (tg && tg.platform && tg.platform !== "unknown") ? "desktop" : "touch";
      window.Ya.Context.AdvManager.render({
        blockId: YA_FULLSCREEN_ID,
        type: "fullscreen",
        platform: plat,
        onRender: () => { rendered = true; },
        onClose: finish,
        onError: finish,
      });
    } catch (_) { finish(); }
  });
  // Reklama umuman ochilmasa (bloklovchi/tarmoq), 5s dan keyin baribir yopamiz.
  setTimeout(() => { if (!rendered) finish(); }, 5000);
}

function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function showReward(i) {
  const msg = L.rewards[i];
  if (!msg) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showReward._t);
  showReward._t = setTimeout(() => toast.classList.remove("show"), 1600);
}

function setProgress() {
  const pct = Math.round((step / TOTAL) * 100);
  bar.style.width = pct + "%";
  stepLbl.textContent = `${L.step} ${step + 1} / ${TOTAL}`;
  pctLbl.textContent = `${pct}% ${L.done}`;
}

function go(next) {
  if (next > step && next <= TOTAL) showReward(step);
  step = next; persist(); render();
}

function navBtns(primaryLabel, onPrimary, opts) {
  opts = opts || {};
  nav.innerHTML = "";
  if (step > 0) {
    const b = document.createElement("button");
    b.className = "btn ghost"; b.textContent = L.back;
    b.onclick = () => go(step - 1);
    nav.appendChild(b);
  }
  if (opts.skip) {
    const s = document.createElement("button");
    s.className = "btn ghost"; s.textContent = L.skip; s.onclick = opts.skip;
    nav.appendChild(s);
  }
  const p = document.createElement("button");
  p.className = "btn" + (opts.cta ? " cta" : ""); p.id = "primary";
  p.textContent = primaryLabel; p.onclick = onPrimary;
  if (opts.disabled) p.disabled = true;
  nav.appendChild(p);
  return p;
}

function setPrimaryEnabled(on) { const p = document.getElementById("primary"); if (p) p.disabled = !on; }

function render() { 
  setProgress();
  const r = [renderName, renderGender, renderAge, renderHeight, renderWeight, renderActivity, renderGoal][step];
  r();

function renderName() {
  card.innerHTML = `<h1>${esc(L.q_name)}</h1><p class="sub">${esc(L.s_name)}</p>
    <div class="field"><label>${esc(L.first)}</label>
      <input id="fn" type="text" maxlength="64" value="${esc(data.first_name)}" autocomplete="given-name" />${TICK}</div>
    <div class="field"><label>${esc(L.last)}</label>
      <input id="ln" type="text" maxlength="64" value="${esc(data.last_name)}" autocomplete="family-name" />${TICK}</div>
    ${L.m_name ? `<p class="micro">${esc(L.m_name)}</p>` : ""}`;
  const fn = document.getElementById("fn"), ln = document.getElementById("ln");
  const ticks = card.querySelectorAll(".tick");
  const check = () => {
    const okF = fn.value.trim().length > 0, okL = ln.value.trim().length > 0;
    fn.classList.toggle("good", okF); ln.classList.toggle("good", okL);
    ticks[0].classList.toggle("show", okF); ticks[1].classList.toggle("show", okL);
    setPrimaryEnabled(okF && okL);
  };
  fn.addEventListener("input", check); ln.addEventListener("input", check);
  navBtns(L.next, () => {
    data.first_name = fn.value.trim(); data.last_name = ln.value.trim();
    if (!data.first_name || !data.last_name) return;
    persist(); go(step + 1);
  }, { disabled: true });
  check();
}

function renderNumber(key, title, sub, label, extraMicro) {
  card.innerHTML = `<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>
    <div class="field"><label>${esc(label)}</label>
      <input id="f" type="number" inputmode="decimal" value="${data[key] ?? ""}" />${TICK}
      <div class="ferr" id="fe"></div></div>${extraMicro ? `<p class="micro">${esc(extraMicro)}</p>` : ""}`;
  const f = document.getElementById("f"), fe = document.getElementById("fe"), tick = card.querySelector(".tick");
  const [min, max] = RANGES[key];
  const check = () => {
    const raw = f.value.trim();
    if (raw === "") { f.classList.remove("good","bad"); tick.classList.remove("show"); fe.textContent = ""; setPrimaryEnabled(false); return; }
    const v = parseFloat(raw);
    const ok = !isNaN(v) && v >= min && v <= max;
    f.classList.toggle("good", ok); f.classList.toggle("bad", !ok);
    tick.classList.toggle("show", ok);
    fe.textContent = ok ? "" : `${L.errRange}: ${min}–${max}`;
    setPrimaryEnabled(ok);
  };
  f.addEventListener("input", check);
  navBtns(L.next, () => {
    const v = parseFloat(f.value); if (isNaN(v) || v < min || v > max) return;
    data[key] = v; persist(); go(step + 1);
  }, { disabled: true });
  check();
}

function calcAgeFromBirthDate(date) {
  const now = new Date();
  const birth = new Date(date.year, date.month - 1, date.day);
  let age = now.getFullYear() - birth.getFullYear();
  const hasBirthdayPassed =
    now.getMonth() > birth.getMonth() ||
    (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
  if (!hasBirthdayPassed) age -= 1;
  return age;
}

  const opt = (v, label, sel) => `<option value="${v}"${sel ? " selected" : ""}>${esc(label)}</option>`;
  const dayOpts = [`<option value="" disabled${sd ? "" : " selected"}>${esc(L.dob_day)}</option>`];
  for (let d = 1; d <= 31; d++) dayOpts.push(opt(d, String(d).padStart(2, "0"), d === sd));
  const monthOpts = [`<option value="" disabled${sm ? "" : " selected"}>${esc(L.dob_month)}</option>`];
  for (let m = 1; m <= 12; m++) monthOpts.push(opt(m, L.months[m - 1], m === sm));
  const yearOpts = [`<option value="" disabled${sy ? "" : " selected"}>${esc(L.dob_year)}</option>`];
  for (let y = curYear - 10; y >= curYear - 100; y--) yearOpts.push(opt(y, String(y), y === sy));

  card.innerHTML = `<h1>${esc(L.q_age)}</h1><p class="sub">${esc(L.s_age)}</p>
    <div class="dob-grid">
      <div class="dob-box"><label>${esc(L.dob_day)}</label><select id="dob-d">${dayOpts.join("")}</select></div>
      <div class="dob-box"><label>${esc(L.dob_month)}</label><select id="dob-m">${monthOpts.join("")}</select></div>
      <div class="dob-box"><label>${esc(L.dob_year)}</label><select id="dob-y">${yearOpts.join("")}</select></div>
    </div>
    <div class="ferr" id="dob-fe"></div>`;

  const dEl = document.getElementById("dob-d");
  const mEl = document.getElementById("dob-m");
  const yEl = document.getElementById("dob-y");
  const fe = document.getElementById("dob-fe");
  let valid = null;

  const check = () => {
    valid = null;
    const day = +dEl.value, month = +mEl.value, year = +yEl.value;
    if (!day || !month || !year) { fe.textContent = ""; setPrimaryEnabled(false); return; }
    const dt = new Date(year, month - 1, day);
    const real = dt.getFullYear() === year && dt.getMonth() === month - 1 && dt.getDate() === day;
    if (!real) { fe.textContent = `${L.errRange}: ${L.age}`; setPrimaryEnabled(false); return; }
    const age = calcAgeFromBirthDate({ day, month, year });
    if (age < 10 || age > 100) { fe.textContent = `${L.errRange}: 10–100`; setPrimaryEnabled(false); return; }
    valid = { day, month, year, age };
    fe.textContent = "";
    setPrimaryEnabled(true);
  };

  [dEl, mEl, yEl].forEach(el => el.addEventListener("change", check));

  navBtns(L.next, () => {
    if (!valid) return;
    data.birth_date = `${String(valid.day).padStart(2, "0")}-${String(valid.month).padStart(2, "0")}-${valid.year}`;
    data.age = valid.age;
    persist();
    go(step + 1);
  }, { disabled: true });

  check();
}

function renderHeight() { renderNumber("height_cm", L.q_height, L.s_height, L.height); }
function renderWeight() { renderNumber("weight_kg", L.q_weight, L.s_weight, L.weight); }

function choiceStep(key, title, sub, items, finish) {
  card.innerHTML = `<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>
    <div class="options">${items.map(it => `
      <div class="opt ${data[key]===it.v?'sel':''}" data-v="${it.v}">
        ${it.ic ? `<span class="ic">${ICONS[it.ic]||""}</span>` : ""}
        <span class="txt">${esc(it.t)}${it.d ? `<small>${esc(it.d)}</small>` : ""}</span>
        <span class="rad"></span>
      </div>`).join("")}</div>`;
  card.querySelectorAll(".opt").forEach(el => el.onclick = () => {
    data[key] = el.dataset.v; persist();
    card.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o.dataset.v === data[key]));
    setPrimaryEnabled(true);
  });
  navBtns(finish ? L.finish : L.next, () => {
    if (!data[key]) return;
    if (finish) submit(); else go(step + 1);
  }, { disabled: !data[key], cta: !!finish });
}

function renderGender() {
  choiceStep("gender", L.q_gender, L.s_gender, [
    { v: "male", t: L.male, ic: "gender_male" },
    { v: "female", t: L.female, ic: "gender_female" },
  ]);
}

function renderActivity() {
  choiceStep("activity", L.q_activity, L.s_activity,
    ["sedentary","moderate","active"].map(v =>
      ({ v, t: L["a_"+v], d: L["a_"+v+"_d"], ic: "act_"+v })));
}

function renderGoal() {
  choiceStep("goal", L.q_goal, L.s_goal, [
    { v: "cut", t: L.g_cut, d: L.g_cut_d, ic: "goal_cut" },
    { v: "maintain", t: L.g_maintain, d: L.g_maintain_d, ic: "goal_maintain" },
    { v: "bulk", t: L.g_bulk, d: L.g_bulk_d, ic: "goal_bulk" },
  ], true);
}

let _calcTimer = null;
let _calcCount = null;
function showCalculating() {
  nav.innerHTML = "";
  card.innerHTML = `<div class="calc">
      <div class="ring"></div>
      <h1>${esc(L.calc_title)}</h1>
      <div class="cstep" id="cstep">${esc(L.calc_steps[0])}</div>
      <div class="cbar"><i id="cbari"></i></div>
    </div>`;
  requestAnimationFrame(() => { const b = document.getElementById("cbari"); if (b) b.style.width = "100%"; });

  // Rag'batlantirish: yuqoridagi progress 100% ga to'ladi
  stepLbl.textContent = "";
  bar.style.width = "100%";
  let pc = Math.round((step / TOTAL) * 100);
  pctLbl.textContent = `${pc}% ${L.done}`;
  _calcCount = setInterval(() => {
    pc = Math.min(100, pc + 2);
    pctLbl.textContent = `${pc}% ${L.done}`;
    if (pc >= 100) { clearInterval(_calcCount); _calcCount = null; }
  }, 45);

  // Bosqich matni silliq almashadi (fade + slide)
  let i = 0;
  const el = document.getElementById("cstep");
  _calcTimer = setInterval(() => {
    i = (i + 1) % L.calc_steps.length;
    if (!el) return;
    el.style.opacity = "0";
    el.style.transform = "translateY(6px)";
    setTimeout(() => {
      el.textContent = L.calc_steps[i];
      el.style.opacity = "1";
      el.style.transform = "translateY(0)";
    }, 300);
  }, 950);
}
function stopCalculating() {
  if (_calcTimer) { clearInterval(_calcTimer); _calcTimer = null; }
  if (_calcCount) { clearInterval(_calcCount); _calcCount = null; }
}

async function submit() {
  showCalculating();
  const minWait = new Promise(r => setTimeout(r, 2400));
  try {
    const initData = tg ? tg.initData : "";
    if (!initData) {
      const reason = !window.Telegram ? "SDK yuklanmadi"
        : !tg ? "WebApp yo'q"
        : (tg.initDataUnsafe && tg.initDataUnsafe.user) ? "imzosiz launch"
        : "kontekst yo'q";
      throw new Error(`initData bo'sh · ${reason} · v${tg?.version || "?"}/${tg?.platform || "?"}`);
    }
    const body = {
      init_data: initData,
      name: (data.first_name + " " + data.last_name).trim(),
      gender: data.gender, age: Math.round(data.age),
      height_cm: data.height_cm, weight_kg: data.weight_kg,
      activity: data.activity, goal: data.goal,
    };
    const res = await fetch("/api/onboarding", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = json?.detail;
      const msg = typeof detail === "string"
        ? detail
        : Array.isArray(detail)
          ? (detail[0]?.msg || L.errSend)
          : L.errSend;
      throw new Error(`${res.status} · ${msg}`);
    }
    await minWait;
    stopCalculating();
    clearStore();
    return boot();  // ro'yxatdan o'tgach dashboard'ga o'tamiz
  } catch (e) {
    stopCalculating();
    render();
    toast.textContent = e?.message || L.errSend;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2800);
  }
}

const OK_SVG = '<svg class="ok" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#1f9d55"/><path d="M20 33l8 8 16-18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function showAlready() {
  bar.style.width = "100%";
  stepLbl.textContent = ""; pctLbl.textContent = `100% ${L.done}`;
  card.innerHTML = `<div class="plan">${OK_SVG}<p class="sub" style="margin-top:8px">${esc(L.already)}</p></div>`;
  nav.innerHTML = ""; closeBtn();
}

function showPlan(plan) {
  bar.style.width = "100%";
  stepLbl.textContent = ""; pctLbl.textContent = `100% ${L.done}`;
  const bf = plan.body_fat_pct != null ? `<span class="chip">Body fat ${esc(plan.body_fat_pct)}%</span>` : "";
  card.innerHTML = `<div class="plan">${OK_SVG}
    <h1>${esc(L.planTitle)}</h1>
    <div class="big">${esc(plan.target_kcal)}</div>
    <div class="kc">${esc(L.kcalLabel)}</div>
    <div class="macros">
      <div><span class="mi">${ICONS.macro_protein}</span><b>${esc(plan.macros.protein_g)}g</b><span>${esc(L.protein)}</span></div>
      <div><span class="mi">${ICONS.macro_carb}</span><b>${esc(plan.macros.carb_g)}g</b><span>${esc(L.carb)}</span></div>
      <div><span class="mi">${ICONS.macro_fat}</span><b>${esc(plan.macros.fat_g)}g</b><span>${esc(L.fat)}</span></div>
    </div>
    <div class="chips"><span class="chip">BMI ${esc(plan.bmi)}</span><span class="chip">TDEE ${esc(plan.tdee)}</span>${bf}</div>
    <div class="ad-slot" id="ya_plan_ad"></div>
  </div>`;
  nav.innerHTML = ""; closeBtn();
  renderAd("ya_plan_ad");
}

function closeBtn() {
  const b = document.createElement("button");
  b.className = "btn cta"; b.textContent = L.close; b.onclick = () => closeWithExitAd();
  nav.appendChild(b);
}

/* ===================== Mini App: Dashboard + Edit ===================== */
const CAM_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>';
const PEN_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
const AV_COLORS = ["#1f9d55", "#1e4c9a", "#ff705d", "#f5b301", "#2ba0ff", "#7c4dff"];
let ME = null;

function authHeaders() { return { "X-Init-Data": tg ? tg.initData : "" }; }

function toastMsg(m) {
  toast.textContent = m; toast.classList.add("show");
  clearTimeout(toastMsg._t);
  toastMsg._t = setTimeout(() => toast.classList.remove("show"), 1800);
}

function hideProgress() { const w = document.querySelector(".pwrap"); if (w) w.style.display = "none"; }
function showProgressBar() { const w = document.querySelector(".pwrap"); if (w) w.style.display = ""; }
function closeMenu() {
  menuPanel.classList.remove("open");
  menuBtn.setAttribute("aria-expanded", "false");
}
function showMenu() {
  menuBtn.style.display = "inline-flex";
  profileMenuItem.textContent = L.profile;
  menuBtn.onclick = () => {
    const open = menuPanel.classList.toggle("open");
    menuBtn.setAttribute("aria-expanded", String(open));
  };
  profileMenuItem.onclick = () => { closeMenu(); showEdit(); };
}
function hideMenu() {
  closeMenu();
  menuBtn.style.display = "none";
}

function monogramHTML(name) {
  const ch = ((name || "?").trim().charAt(0) || "?").toUpperCase();
  const color = AV_COLORS[ch.charCodeAt(0) % AV_COLORS.length];
  return `<div class="avatar" style="background:${color}">${esc(ch)}</div>`;
}
function avatarHTML(p) {
  const src = p.avatar_url ? p.avatar_url : (tgUser && tgUser.photo_url ? tgUser.photo_url : null);
  if (src) return `<div class="avatar"><img src="${esc(src)}" alt="" /></div>`;
  return monogramHTML(p.name);
}

async function boot() {
  hideProgress();
  hideMenu();
  nav.innerHTML = "";
  card.innerHTML = `<div class="calc"><div class="ring"></div></div>`;
  try {
    const r = await fetch("/api/me", { headers: authHeaders() });
    ME = r.ok ? await r.json() : { registered: false };
  } catch (e) { ME = { registered: false }; }
  if (ME && ME.registered) return showDashboard();
  showProgressBar();
  step = 0; render();
}

function macroRow(plan) {
  if (!plan) return "";
  return `<div class="macros">
    <div><span class="mi">${ICONS.macro_protein}</span><b>${esc(plan.macros.protein_g)}g</b><span>${esc(L.protein)}</span></div>
    <div><span class="mi">${ICONS.macro_carb}</span><b>${esc(plan.macros.carb_g)}g</b><span>${esc(L.carb)}</span></div>
    <div><span class="mi">${ICONS.macro_fat}</span><b>${esc(plan.macros.fat_g)}g</b><span>${esc(L.fat)}</span></div>
  </div>`;
}

function showDashboard() {
  hideProgress();
  card.className = "card dashboard-card";
  showMenu();
  const p = ME.profile, plan = ME.plan;
  const bf = plan && plan.body_fat_pct != null ? `<span class="chip">Body fat ${esc(plan.body_fat_pct)}%</span>` : "";
  const chips = plan ? `<div class="chips"><span class="chip">BMI ${esc(plan.bmi)}</span><span class="chip">TDEE ${esc(plan.tdee)}</span>${bf}</div>` : "";
  card.innerHTML = `<div class="dash">
    <div class="dhead">
      <div class="avwrap" id="avwrap">${avatarHTML(p)}
        <button class="avedit" id="avBtn" title="${esc(L.changePhoto)}">${CAM_SVG}</button>
        <input type="file" id="avFile" accept="image/jpeg,image/png,image/webp" hidden />
      </div>
      <div class="dname">
        <div class="nrow"><span id="nameTxt">${esc(p.name)}</span>
          <button class="lnk" id="editName" aria-label="edit">${PEN_SVG}</button></div>
        <div class="tag" style="margin-top:2px">${esc(L.tagline)}</div>
      </div>
    </div>
    <div class="limitCard">
      <div class="kc">${esc(L.kcalLabel)}</div>
      <div class="big">${plan ? esc(plan.target_kcal) : "—"}</div>
      ${macroRow(plan)}
      ${chips}
    </div>
    <div class="ph">${esc(L.comingSoon)}</div>
  </div>`;
  nav.innerHTML = "";
  const rc = document.createElement("button");
  rc.className = "btn cta"; rc.textContent = L.recalc; rc.onclick = () => showEdit();
  nav.appendChild(rc);
  document.getElementById("avBtn").onclick = () => document.getElementById("avFile").click();
  document.getElementById("avFile").onchange = onAvatarPick;
  document.getElementById("editName").onclick = startNameEdit;
}

async function onAvatarPick(e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  const fd = new FormData(); fd.append("file", f);
  try {
    const r = await fetch("/api/me/avatar", { method: "POST", headers: authHeaders(), body: fd });
    if (!r.ok) throw new Error(String(r.status));
    const j = await r.json();
    ME.profile.avatar_url = j.url;
    const wrap = document.getElementById("avwrap");
    wrap.querySelector(".avatar").outerHTML = avatarHTML(ME.profile);
    toastMsg(L.saved);
  } catch (err) { toastMsg(L.errSend); }
}

function startNameEdit() {
  const holder = document.querySelector(".nrow");
  const cur = ME.profile.name;
  holder.innerHTML = `<input id="nameInp" class="ninp" maxlength="64" value="${esc(cur)}" />
    <button class="lnk" id="nameSave" aria-label="save">${PEN_SVG}</button>`;
  const inp = document.getElementById("nameInp"); inp.focus();
  document.getElementById("nameSave").onclick = async () => {
    const v = inp.value.trim();
    if (v.length < 2) { toastMsg(L.errReq); return; }
    await saveProfile({ name: v });
  };
}

function buildProfileBody(patch) {
  const p = ME.profile;
  const pick = (k) => (k in patch ? patch[k] : p[k]);
  return {
    name: pick("name"), gender: pick("gender"), age: pick("age"),
    height_cm: pick("height_cm"), weight_kg: pick("weight_kg"),
    activity: pick("activity"), goal: pick("goal"),
  };
}

async function saveProfile(patch) {
  const body = buildProfileBody(patch);
  try {
    const r = await fetch("/api/me", {
      method: "PATCH",
      headers: { ...authHeaders(), "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    if (!r.ok) throw new Error(String(r.status));
    ME = await r.json();
    showDashboard(); toastMsg(L.saved);
  } catch (e) { toastMsg(L.errSend); }
}

function numOrNull(id) { const v = document.getElementById(id).value.trim(); return v === "" ? null : parseFloat(v); }
function selVal(id) { const on = document.querySelector(`#${id} .csel.on`); return on ? on.dataset.v : null; }

function showEdit() {
  hideProgress();
  closeMenu();
  card.className = "card";
  const p = ME.profile;
  const chip = (v, label, cur) => `<button data-v="${v}" class="csel ${cur === v ? "on" : ""}">${esc(label)}</button>`;
  const acts = ["sedentary", "moderate", "active"].map(v => chip(v, L["a_" + v], p.activity)).join("");
  const goals = ["cut", "maintain", "bulk"].map(v => chip(v, L["g_" + v], p.goal)).join("");
  card.innerHTML = `<div class="edit">
    <h1>${esc(L.recalc)}</h1>
    <div class="erow"><label>${esc(L.q_gender)}</label><div class="chipsel" id="e_gender">
      ${chip("male", L.male, p.gender)}${chip("female", L.female, p.gender)}</div></div>
    <div class="erow"><label>${esc(L.q_age)}</label><input id="e_age" type="number" inputmode="numeric" value="${esc(p.age)}" /></div>
    <div class="erow"><label>${esc(L.height)}</label><input id="e_height" type="number" inputmode="decimal" step="0.1" value="${esc(p.height_cm)}" /></div>
    <div class="erow"><label>${esc(L.weight)}</label><input id="e_weight" type="number" inputmode="decimal" step="0.1" value="${esc(p.weight_kg == null ? "" : p.weight_kg)}" /></div>
    <div class="erow"><label>${esc(L.q_activity)}</label><div class="chipsel" id="e_activity">${acts}</div></div>
    <div class="erow"><label>${esc(L.q_goal)}</label><div class="chipsel" id="e_goal">${goals}</div></div>
  </div>`;
  card.querySelectorAll(".chipsel").forEach(sel => {
    sel.querySelectorAll(".csel").forEach(b => {
      b.onclick = () => {
        sel.querySelectorAll(".csel").forEach(x => x.classList.remove("on"));
        b.classList.add("on");
      };
    });
  });
  nav.innerHTML = "";
  const back = document.createElement("button");
  back.className = "btn ghost"; back.textContent = L.back; back.onclick = () => showDashboard();
  const save = document.createElement("button");
  save.className = "btn cta"; save.textContent = L.save; save.onclick = onEditSave;
  nav.appendChild(back); nav.appendChild(save);
}

async function onEditSave() {
  const patch = {
    gender: selVal("e_gender"),
    age: parseInt(document.getElementById("e_age").value, 10),
    height_cm: parseFloat(document.getElementById("e_height").value),
    weight_kg: parseFloat(document.getElementById("e_weight").value),
    activity: selVal("e_activity"),
    goal: selVal("e_goal"),
  };
  if (!patch.gender || !patch.activity || !patch.goal ||
      !patch.age || !patch.height_cm || !patch.weight_kg) { toastMsg(L.errReq); return; }
  await saveProfile(patch);
}

boot();
</script>
