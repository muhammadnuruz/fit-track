<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>FitTrack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --paper: #f6f1ea;
    --paper-strong: #eee4d8;
    --card: rgba(255,255,255,0.24);
    --card-2: rgba(255,255,255,0.7);
    --ink: #1a1917;
    --ink-soft: #5d574f;
    --line: rgba(26,25,23,0.08);
    --accent: #9c6f49;
    --accent-soft: #f0e3d6;
    --sage-deep: #6b7d5a;
    --blue: #2d6ad5;
    --shadow: 0 12px 28px rgba(26,25,23,0.04);
    --radius-xl: 30px;
    --radius-lg: 20px;
    --radius-md: 15px;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Inter", -apple-system, "Segoe UI", sans-serif;
    display: flex;
    justify-content: center;
    padding: 18px 16px 20px;
  }

  .app {
    width: 100%;
    max-width: 440px;
  }

  .head {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin: 8px 0 20px;
  }

  .brand-wrap {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 0;
    border-radius: 999px;
    background: transparent;
    border: none;
  }

  .logo {
    width: 170px;
    height: auto;
    display: block;
    flex: none;
    background: transparent;
    filter: none;
  }

  .brand {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.06em;
    color: var(--ink);
  }

  .brand .g {
    color: var(--sage-deep);
  }

  .tag {
    margin-top: 10px;
    color: var(--ink-soft);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    text-align: center;
    font-weight: 600;
  }

  .pwrap {
    margin: 0 0 18px;
  }

  .ptop {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 8px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .ptop b {
    color: var(--sage-deep);
    font-weight: 700;
  }

  .bar {
    height: 10px;
    background: rgba(44,46,42,0.08);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }

  .bar > i {
    display: block;
    width: 0;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #b7855b 0%, #1b1a18 100%);
    transition: width 0.35s ease;
  }

  .card {
    background: rgba(255,255,255,0.24);
    border: 1px solid var(--line);
    border-radius: 26px;
    padding: 22px 18px 16px;
    box-shadow: var(--shadow);
    animation: rise 0.35s ease both;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  h1 {
    margin: 0 0 8px;
    font-size: clamp(26px, 5vw, 34px);
    line-height: 1.08;
    letter-spacing: -0.06em;
    font-weight: 700;
  }

  p.sub {
    margin: 0 0 18px;
    color: var(--ink-soft);
    font-size: 14px;
    line-height: 1.5;
  }

  .field {
    position: relative;
    margin-bottom: 14px;
  }

  .dob-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1.4fr;
    gap: 10px;
    margin-top: 6px;
  }

  .dob-box {
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 10px 10px 8px;
    min-height: 62px;
  }

  .dob-box label {
    display: block;
    margin-bottom: 6px;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .dob-box input {
    width: 100%;
    border: none;
    background: transparent;
    padding: 0;
    font-size: 18px;
    color: var(--ink);
    text-align: center;
    outline: none;
  }

  .dob-box input::placeholder {
    color: rgba(44,46,42,0.35);
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 600;
  }

  input {
    width: 100%;
    padding: 16px 48px 16px 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.8);
    color: var(--ink);
    font-size: 17px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }

  input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 4px rgba(45,106,213,0.08);
  }

  input.good {
    border-color: var(--sage-deep);
    box-shadow: 0 0 0 4px rgba(142,212,98,0.08);
  }

  input.bad {
    border-color: #d55e4d;
    box-shadow: 0 0 0 4px rgba(213,94,77,0.08);
  }

  .tick {
    position: absolute;
    right: 13px;
    top: 40px;
    width: 22px;
    height: 22px;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .tick.show {
    opacity: 1;
    transform: scale(1);
  }

  .micro, .ferr {
    margin: 4px 2px 0;
    font-size: 12px;
    line-height: 1.4;
  }

  .micro {
    color: var(--ink-soft);
  }

  .ferr {
    color: #c14c3d;
    min-height: 18px;
  }

  .options {
    display: grid;
    gap: 10px;
  }

  .opt {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 62px;
    padding: 12px 14px;
    background: rgba(255,255,255,0.12);
    border: 1px solid var(--line);
    border-radius: 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  .opt:hover { transform: translateY(-1px); }

  .opt .txt {
    flex: 1;
    font-size: 16px;
    line-height: 1.2;
    font-weight: 600;
    letter-spacing: -0.02em;
  }

  .opt small {
    display: block;
    margin-top: 3px;
    color: var(--ink-soft);
    font-weight: 500;
    font-size: 12px;
    line-height: 1.4;
  }

  .opt .rad {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 1.5px solid rgba(27, 26, 24, 0.28);
    position: relative;
    flex: none;
  }

  .opt.sel {
    border-color: rgba(26,25,23,0.18);
    background: rgba(26,25,23,0.03);
  }

  .opt.sel .rad {
    border-color: var(--ink);
  }

  .opt.sel .rad::after {
    content: "";
    position: absolute;
    inset: 4px;
    border-radius: 50%;
    background: var(--ink);
  }

  .nav {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
  }

  button.btn {
    appearance: none;
    border: 0;
    font: inherit;
    cursor: pointer;
    border-radius: 999px;
    transition: transform 0.15s ease, opacity 0.15s ease, box-shadow 0.15s ease;
  }

  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn.ghost {
    flex: 0 0 auto;
    padding: 14px 18px;
    background: rgba(255,255,255,0.42);
    border: 1px solid rgba(44,46,42,0.08);
    color: var(--ink);
    font-weight: 600;
  }

  .btn:not(.ghost) {
    flex: 1;
    padding: 15px 18px;
    background: var(--ink);
    color: #fff;
    font-weight: 700;
    letter-spacing: 0.02em;
    box-shadow: none;
    text-transform: none;
  }

  .btn.cta {
    background: linear-gradient(135deg, var(--ink) 0%, #433a33 100%);
    box-shadow: none;
  }

  .toast {
    position: fixed;
    left: 50%;
    top: 16px;
    transform: translate(-50%, -80px);
    background: rgba(44,46,42,0.94);
    color: #fff;
    padding: 12px 18px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.02em;
    box-shadow: var(--shadow);
    opacity: 0;
    transition: transform 0.3s ease, opacity 0.3s ease;
    z-index: 9;
  }

  .toast.show {
    transform: translate(-50%, 0);
    opacity: 1;
  }

  .plan {
    text-align: center;
  }

  .plan .ok {
    width: 72px;
    height: 72px;
    margin: 6px auto 10px;
    animation: pop 0.42s ease both;
  }

  @keyframes pop {
    0% { transform: scale(0.8); opacity: 0; }
    70% { transform: scale(1.08); opacity: 1; }
    100% { transform: scale(1); opacity: 1; }
  }

  .plan h1 {
    font-size: clamp(30px, 7vw, 40px);
    margin-top: 10px;
  }

  .plan .big {
    margin-top: 10px;
    font-size: clamp(42px, 11vw, 62px);
    line-height: 0.9;
    font-weight: 800;
    letter-spacing: -0.08em;
    color: var(--ink);
  }

  .plan .kc {
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .macros {
    display: grid;
    grid-template-columns: repeat(3, minmax(0,1fr));
    gap: 10px;
    margin-top: 20px;
  }

  .macros div {
    background: var(--card-2);
    border: 1px solid rgba(44,46,42,0.08);
    border-radius: 22px;
    padding: 14px 8px 12px;
  }

  .macros b {
    display: block;
    font-size: 24px;
    letter-spacing: -0.06em;
    color: var(--sage-deep);
  }

  .macros span {
    display: block;
    margin-top: 2px;
    color: var(--ink-soft);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .chips {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    padding: 8px 12px;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(44,46,42,0.08);
    border-radius: 999px;
    color: var(--ink);
    font-size: 12px;
    font-weight: 700;
  }
</style>
</head>
<body>
<div class="app">

      <img class="logo" src="assets/logo_transparent.png" alt="FitTrack logo" />

  <div class="pwrap">

</div>

const LANG = ["uz","ru","en"].includes(params.get("lang")) ? params.get("lang")

    rewards: ["Ajoyib boshlanish", "Zo'r natija", "Davom etamiz", "Yarmidan oshdik", "Ajoyib", "So'nggi qadam", "Deyarli tayyor"],
    planTitle: "Rejangiz tayyor!", kcalLabel: "kunlik kaloriya",

    errReq: "To'ldiring", errRange: "Oralig'i",

    step: "Шаг", of: "из", done: "пройдено",
    q_name: "Давайте познакомимся", s_name: "Введите ваше имя и фамилию.",

    q_measures: "Body measurements", s_measures: "For a precise body-fat estimate — optional.",

    m_measures: "The plan works even if you skip these.",
    hipNote: "For women, hip measurement is needed for body fat.",
    back: "Back", next: "Continue", skip: "Skip", finish: "Create account & start",
    rewards: ["Great start", "Perfect momentum", "Keep going", "Over halfway", "Doing great", "Final step", "Nearly done"],
    planTitle: "Your plan is ready!", kcalLabel: "daily calories",
    protein: "Protein", carb: "Carbs", fat: "Fat", close: "Close",
    already: "You are already registered.",
    errReq: "Required", errRange: "Range",
    errSend: "Error, please try again", sending: "Creating...",
  },
};
const L = T[LANG];
document.getElementById("tagline").textContent = L.tagline;

const LS_KEY = "fittrack_onb_" + (tgUser.id || "anon");
const RANGES = { age: [10, 100], height_cm: [100, 250], weight_kg: [30, 350] };
const data = {
  first_name: tgUser.first_name || "", last_name: tgUser.last_name || "",
  gender: null, age: null, height_cm: null, weight_kg: null,
  activity: "moderate", goal: null, waist_cm: null, neck_cm: null, hip_cm: null,
};
let step = 0;

(function restore() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      Object.assign(data, saved.data || {});
      if (typeof saved.step === "number" && saved.step >= 0 && saved.step < 7) step = saved.step;
    }
  } catch (e) {}
})();

function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify({ data, step })); } catch (e) {} }
function clearStore() { try { localStorage.removeItem(LS_KEY); } catch (e) {} }

const TOTAL = 7;
const card = document.getElementById("card");
const nav = document.getElementById("nav");
const bar = document.getElementById("bar");
const stepLbl = document.getElementById("stepLbl");
const pctLbl = document.getElementById("pctLbl");
const toast = document.getElementById("toast");

const TICK = '<svg class="tick" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="11" fill="#5d9a64"/><path d="M7 12.5l3.2 3.2L17 9" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }

function showReward(i) {
  const msg = L.rewards[i];
  if (!msg) return;
  toast.textContent = msg;
  toast.classList.add("show");
  clearTimeout(showReward._t);
  showReward._t = setTimeout(() => toast.classList.remove("show"), 1600);
}

function setProgress() {
  const pct = Math.round((step / TOTAL) * 100);
  bar.style.width = pct + "%";
  stepLbl.textContent = `${L.step} ${step + 1} / ${TOTAL}`;
  pctLbl.textContent = `${pct}% ${L.done}`;
}

function go(next) {
  if (next > step && next <= TOTAL) showReward(step);
  step = next; persist(); render();
}

function navBtns(primaryLabel, onPrimary, opts) {
  opts = opts || {};
  nav.innerHTML = "";
  if (step > 0) {
    const b = document.createElement("button");
    b.className = "btn ghost"; b.textContent = L.back;
    b.onclick = () => go(step - 1);
    nav.appendChild(b);
  }
  if (opts.skip) {
    const s = document.createElement("button");
    s.className = "btn ghost"; s.textContent = L.skip; s.onclick = opts.skip;
    nav.appendChild(s);
  }
  const p = document.createElement("button");
  p.className = "btn" + (opts.cta ? " cta" : ""); p.id = "primary";
  p.textContent = primaryLabel; p.onclick = onPrimary;
  if (opts.disabled) p.disabled = true;
  nav.appendChild(p);
  return p;
}

function setPrimaryEnabled(on) { const p = document.getElementById("primary"); if (p) p.disabled = !on; }

function render() { 
  setProgress();
  const r = [renderName, renderGender, renderAge, renderHeight, renderWeight, renderActivity, renderGoal][step];
  r();
}

function renderName() {
  card.innerHTML = `<h1>${esc(L.q_name)}</h1><p class="sub">${esc(L.s_name)}</p>
    <div class="field"><label>${esc(L.first)}</label>
      <input id="fn" type="text" maxlength="64" value="${esc(data.first_name)}" autocomplete="given-name" />${TICK}</div>
    <div class="field"><label>${esc(L.last)}</label>
      <input id="ln" type="text" maxlength="64" value="${esc(data.last_name)}" autocomplete="family-name" />${TICK}</div>
    ${L.m_name ? `<p class="micro">${esc(L.m_name)}</p>` : ""}`;
  const fn = document.getElementById("fn"), ln = document.getElementById("ln");
  const ticks = card.querySelectorAll(".tick");
  const check = () => {
    const okF = fn.value.trim().length > 0, okL = ln.value.trim().length > 0;
    fn.classList.toggle("good", okF); ln.classList.toggle("good", okL);
    ticks[0].classList.toggle("show", okF); ticks[1].classList.toggle("show", okL);
    setPrimaryEnabled(okF && okL);
  };
  fn.addEventListener("input", check); ln.addEventListener("input", check);
  navBtns(L.next, () => {
    data.first_name = fn.value.trim(); data.last_name = ln.value.trim();
    if (!data.first_name || !data.last_name) return;
    persist(); go(step + 1);
  }, { disabled: true });
  check();
}

function renderNumber(key, title, sub, label, extraMicro) {
  card.innerHTML = `<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>
    <div class="field"><label>${esc(label)}</label>
      <input id="f" type="number" inputmode="decimal" value="${data[key] ?? ""}" />${TICK}
      <div class="ferr" id="fe"></div></div>${extraMicro ? `<p class="micro">${esc(extraMicro)}</p>` : ""}`;
  const f = document.getElementById("f"), fe = document.getElementById("fe"), tick = card.querySelector(".tick");
  const [min, max] = RANGES[key];
  const check = () => {
    const raw = f.value.trim();
    if (raw === "") { f.classList.remove("good","bad"); tick.classList.remove("show"); fe.textContent = ""; setPrimaryEnabled(false); return; }
    const v = parseFloat(raw);
    const ok = !isNaN(v) && v >= min && v <= max;
    f.classList.toggle("good", ok); f.classList.toggle("bad", !ok);
    tick.classList.toggle("show", ok);
    fe.textContent = ok ? "" : `${L.errRange}: ${min}–${max}`;
    setPrimaryEnabled(ok);
  };
  f.addEventListener("input", check);
  navBtns(L.next, () => {
    const v = parseFloat(f.value); if (isNaN(v) || v < min || v > max) return;
    data[key] = v; persist(); go(step + 1);
  }, { disabled: true });
  check();
}

function formatDateInput(raw) {
  const digits = String(raw || "").replace(/\D/g, "").slice(0, 8);
  if (!digits) return "";

  let out = digits;
  if (digits.length > 2) out = `${digits.slice(0, 2)}.${digits.slice(2)}`;
  if (digits.length > 4) out = `${out.slice(0, 5)}.${out.slice(5)}`;

  const parts = out.split(".");
  if (parts[0] && Number(parts[0]) > 31) parts[0] = "31";
  if (parts[1] && Number(parts[1]) > 12) parts[1] = "12";
  out = parts.join(".");

  return out;
}

function parseBirthDate(raw) {
  const s = String(raw || "").trim();
  if (!s) return null;

  const normalized = s.replace(/,/g, ".").replace(/\s+/g, "");
  const match = normalized.match(/^([0-9]{1,2})\.([0-9]{1,2})\.([0-9]{4})$/);
  if (!match) return null;

  const day = Number(match[1]);
  const month = Number(match[2]);
  const year = Number(match[3]);
  if (!day || !month || !year) return null;

  const date = new Date(year, month - 1, day);
  const valid = date.getFullYear() === year && date.getMonth() === month - 1 && date.getDate() === day;
  if (!valid || year < 1950 || year > new Date().getFullYear()) return null;

  return { day, month, year };
}

function calcAgeFromBirthDate(date) {
  const now = new Date();
  const birth = new Date(date.year, date.month - 1, date.day);
  let age = now.getFullYear() - birth.getFullYear();
  const hasBirthdayPassed =
    now.getMonth() > birth.getMonth() ||
    (now.getMonth() === birth.getMonth() && now.getDate() >= birth.getDate());
  if (!hasBirthdayPassed) age -= 1;
  return age;
}

function renderAge() {
  const saved = data.birth_date || "";

  card.innerHTML = `<h1>${esc(L.q_age)}</h1><p class="sub">${esc(L.s_age)}</p>
    <div class="field">
      <label>${esc(L.age)}</label>
      <input id="dob" type="text" inputmode="numeric" maxlength="10" value="${esc(saved)}" placeholder="dd.mm.yyyy" />
      <div class="ferr" id="dob-fe"></div>
    </div>`;

  const dobEl = document.getElementById("dob");
  const fe = document.getElementById("dob-fe");

  const check = () => {
    dobEl.value = formatDateInput(dobEl.value);

    const raw = dobEl.value.trim();
    const parsed = parseBirthDate(raw);

    if (!raw) {
      dobEl.classList.remove("good", "bad");
      fe.textContent = "";
      setPrimaryEnabled(false);
      return;
    }

    if (!parsed) {
      dobEl.classList.remove("good");
      dobEl.classList.add("bad");
      fe.textContent = `${L.errRange}: ${L.age}`;
      setPrimaryEnabled(false);
      return;
    }

    const age = calcAgeFromBirthDate(parsed);
    if (age < 10 || age > 100) {
      dobEl.classList.remove("good");
      dobEl.classList.add("bad");
      fe.textContent = `${L.errRange}: 10–100`;
      setPrimaryEnabled(false);
      return;
    }

    dobEl.classList.remove("bad");
    dobEl.classList.add("good");
    fe.textContent = "";
    setPrimaryEnabled(true);
  };

  dobEl.addEventListener("input", check);

  navBtns(L.next, () => {
    const parsed = parseBirthDate(dobEl.value);
    if (!parsed) return;
    const age = calcAgeFromBirthDate(parsed);
    data.birth_date = `${parsed.day.toString().padStart(2, "0")}.${parsed.month.toString().padStart(2, "0")}.${parsed.year}`;
    data.age = age;
    persist();
    go(step + 1);
  }, { disabled: true });

  check();
}

function renderHeight() { renderNumber("height_cm", L.q_height, L.s_height, L.height); }
function renderWeight() { renderNumber("weight_kg", L.q_weight, L.s_weight, L.weight); }

function choiceStep(key, title, sub, items, finish) {
  card.innerHTML = `<h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p>
    <div class="options">${items.map(it => `
      <div class="opt ${data[key]===it.v?'sel':''}" data-v="${it.v}">
        <span class="txt">${esc(it.t)}${it.d ? `<small>${esc(it.d)}</small>` : ""}</span>
        <span class="rad"></span>
      </div>`).join("")}</div>`;
  card.querySelectorAll(".opt").forEach(el => el.onclick = () => {
    data[key] = el.dataset.v; persist();
    card.querySelectorAll(".opt").forEach(o => o.classList.toggle("sel", o.dataset.v === data[key]));
    setPrimaryEnabled(true);
  });
  navBtns(finish ? L.finish : L.next, () => {
    if (!data[key]) return;
    if (finish) submit(); else go(step + 1);
  }, { disabled: !data[key], cta: !!finish });
}

function renderGender() {
  choiceStep("gender", L.q_gender, L.s_gender, [
    { v: "male", t: L.male },
    { v: "female", t: L.female },
  ]);
}

function renderActivity() {
  choiceStep("activity", L.q_activity, L.s_activity, ["sedentary","light","moderate"].map(v =>
    ({ v, t: L["a_"+v], d: L["a_"+v+"_d"] })));
}

function renderGoal() {
  choiceStep("goal", L.q_goal, L.s_goal, [
    { v: "cut", t: L.g_cut, d: L.g_cut_d },
    { v: "maintain", t: L.g_maintain, d: L.g_maintain_d },
    { v: "bulk", t: L.g_bulk, d: L.g_bulk_d },
  ], true);
}

async function submit() {
  bar.style.width = "100%";
  nav.querySelectorAll("button").forEach(b => b.disabled = true);
  const p = document.getElementById("primary"); if (p) p.textContent = L.sending;
  const body = {
    init_data: tg ? tg.initData : "",
    name: (data.first_name + " " + data.last_name).trim(),
    gender: data.gender, age: Math.round(data.age),
    height_cm: data.height_cm, weight_kg: data.weight_kg,
    activity: data.activity, goal: data.goal,
    waist_cm: data.waist_cm, neck_cm: data.neck_cm, hip_cm: data.hip_cm,
  };
  try {
    const res = await fetch("/api/onboarding", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error("http " + res.status);
    const json = await res.json();
    clearStore();
    if (json.already) return showAlready();
    showPlan(json.plan);
  } catch (e) {
    nav.querySelectorAll("button").forEach(b => b.disabled = false);
    if (p) p.textContent = L.finish;
    toast.textContent = L.errSend; toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 2200);
  }
}

const OK_SVG = '<svg class="ok" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="30" fill="#5d9a64"/><path d="M20 33l8 8 16-18" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function showAlready() {
  setProgress(); bar.style.width = "100%";
  card.innerHTML = `<div class="plan">${OK_SVG}<p class="sub" style="margin-top:8px">${esc(L.already)}</p></div>`;
  nav.innerHTML = ""; closeBtn();
}

function showPlan(plan) {
  bar.style.width = "100%";
  stepLbl.textContent = ""; pctLbl.textContent = `100% ${L.done}`;
  const bf = plan.body_fat_pct != null ? `<span class="chip">Body fat ${plan.body_fat_pct}%</span>` : "";
  card.innerHTML = `<div class="plan">${OK_SVG}
    <h1>${esc(L.planTitle)}</h1>
    <div class="big">${plan.target_kcal}</div>
    <div class="kc">${esc(L.kcalLabel)}</div>
    <div class="macros">
      <div><b>${plan.macros.protein_g}g</b><span>${esc(L.protein)}</span></div>
      <div><b>${plan.macros.carb_g}g</b><span>${esc(L.carb)}</span></div>
      <div><b>${plan.macros.fat_g}g</b><span>${esc(L.fat)}</span></div>
    </div>
    <div class="chips"><span class="chip">BMI ${plan.bmi}</span><span class="chip">TDEE ${plan.tdee}</span>${bf}</div>
  </div>`;
  nav.innerHTML = ""; closeBtn();
  if (tg) setTimeout(() => tg.close(), 4000);
}

function closeBtn() {
  const b = document.createElement("button");
  b.className = "btn cta"; b.textContent = L.close; b.onclick = () => { if (tg) tg.close(); };
  nav.appendChild(b);
}

render();
</script>
</body>
