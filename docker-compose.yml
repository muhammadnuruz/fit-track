services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fittrack-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fittrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fittrack}
      POSTGRES_DB: ${POSTGRES_DB:-fittrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fittrack_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fittrack} -d ${POSTGRES_DB:-fittrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Bot + API (bitta jarayon). DB tayyor bo'lgach ishga tushadi.
  # `docker compose up` bilan default ravishda ko'tariladi (Docker-first).
  bot:
    build: .
    container_name: fittrack-bot
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Konteyner ichida DB 'db' xostida va ICHKI 5432 portida (host'dagi 5433 emas).
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    volumes:
      - ./app:/app/app
      - ./migrations:/app/migrations
      - ./alembic.ini:/app/alembic.ini
      - ./scripts:/app/scripts

volumes:
  fittrack_pgdata:
